name: R100B MFEM Finite Record Reference

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_bakeoff.py'
      - 'backend/src/htdt/acoustic_bakeoff_observation.py'
      - 'backend/src/htdt/acoustic_benchmark.py'
      - 'benchmarks/acoustics/r100a_manifest.json'
      - 'benchmarks/acoustics/r100b_candidates.json'
      - 'benchmarks/acoustics/mfem_probe/CMakeLists.txt'
      - 'benchmarks/acoustics/mfem_probe/concave_finite_record.cpp'
      - 'scripts/run_r100b_mfem_finite_record_reference.py'
      - '.github/workflows/r100b-mfem-finite-record.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-mfem-finite-record-reference:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      MFEM_SHA: d964264cdb9a13e94a201b6c236c7721e0c8765f
      PROBE_OUTPUT: artifacts/r100b/mfem_concave_finite_record_reference.json
      HTDT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused HTDT probe runtime
        run: python -m pip install -e ".\backend" psutil

      - name: Preflight finite-record runner
        run: python -m py_compile scripts\run_r100b_mfem_finite_record_reference.py

      - name: Checkout pinned MFEM source
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mfem-r100b-finite-record'
          git clone --filter=blob:none https://github.com/mfem/mfem.git $root
          git -C $root checkout --detach $env:MFEM_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:MFEM_SHA) {
            throw "MFEM checkout mismatch: $actual"
          }
          "MFEM_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and build focused transient MFEM probe
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'mfem-r100b-finite-record-build'
          "MFEM_BUILD_DIR=$build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cmake -S benchmarks\acoustics\mfem_probe -B $build -A x64 -DHTDT_MFEM_SOURCE_DIR="$env:MFEM_ROOT" -DMFEM_USE_EXCEPTIONS=ON
          if ($LASTEXITCODE -ne 0) {
            $timer.Stop()
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM v4.10 serial CMake configure failed for the R100A-4 transient reference." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BUILD_S=$($timer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          cmake --build $build --config Release --target r100b_mfem_concave_finite_record --parallel 4
          $buildExit = $LASTEXITCODE
          $timer.Stop()
          "MFEM_BUILD_S=$($timer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($buildExit -ne 0) {
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM v4.10 finite-record probe build failed on GitHub-hosted Windows." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          $exe = Get-ChildItem -Path $build -Recurse -Filter 'r100b_mfem_concave_finite_record.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM finite-record build succeeded but the executable was not found." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          "MFEM_RUNTIME_AVAILABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MFEM_PROBE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run independent R100A-4 MFEM finite-record reference
        if: env.MFEM_RUNTIME_AVAILABLE == '1'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mfem-r100b-finite-record-work'
          python scripts\run_r100b_mfem_finite_record_reference.py --manifest benchmarks\acoustics\r100a_manifest.json --candidates benchmarks\acoustics\r100b_candidates.json --mfem-root $env:MFEM_ROOT --build-dir $env:MFEM_BUILD_DIR --executable $env:MFEM_PROBE_EXE --work-dir $work --output $env:PROBE_OUTPUT --build-s $env:MFEM_BUILD_S

      - name: Record blocked setup/build evidence
        if: env.MFEM_RUNTIME_AVAILABLE != '1'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mfem-r100b-finite-record-work'
          python scripts\run_r100b_mfem_finite_record_reference.py --manifest benchmarks\acoustics\r100a_manifest.json --candidates benchmarks\acoustics\r100b_candidates.json --mfem-root $env:MFEM_ROOT --build-dir $env:MFEM_BUILD_DIR --work-dir $work --output $env:PROBE_OUTPUT --build-s $env:MFEM_BUILD_S --blocked-reason "$env:MFEM_BLOCK_REASON"

      - name: Show finite-record reference outcome
        shell: pwsh
        run: |
          $probe = Get-Content -Raw $env:PROBE_OUTPUT | ConvertFrom-Json
          Write-Host "R100B_MFEM_FINITE_RECORD_OUTCOME=$($probe.finite_record_reference_outcome)"
          Write-Host "R100B_WORKFLOW_RESULT_IS_REFERENCE_RESULT=$($probe.workflow_result_is_reference_result)"
          Write-Host "R100B_R100A_HASH=$($probe.r100a_semantic_hash)"
          Write-Host "R100B_CANDIDATE_HASH=$($probe.candidate_manifest_hash)"
          if ($null -ne $probe.details.qualification) {
            Write-Host "R100B_REFERENCE_QUALIFICATION=$($probe.details.qualification | ConvertTo-Json -Compress)"
          }
          if ($null -ne $probe.details.resource_evidence) {
            Write-Host "R100B_RESOURCE_EVIDENCE=$($probe.details.resource_evidence | ConvertTo-Json -Compress)"
          }
          if ($null -ne $probe.details.error) {
            Write-Host "R100B_REFERENCE_ERROR=$($probe.details.error)"
          }

      - name: Upload finite-record reference evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r100b-mfem-finite-record-reference
          path: artifacts/r100b/mfem_concave_finite_record_reference.json
          if-no-files-found: error
