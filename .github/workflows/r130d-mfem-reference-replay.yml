name: R130D pinned MFEM reference replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/r130d-mfem-reference-replay.yml'
      - 'scripts/run_r130d_mfem_reference_replay.py'
      - 'scripts/run_r130d_general3d_validation.py'
      - 'benchmarks/acoustics/r130d_mfem_reference/**'
      - 'benchmarks/acoustics/r130d_general3d_validation_plan.json'
permissions:
  contents: read

jobs:
  pinned-mfem-reference:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements-n05-windows.lock'
      - name: Install pinned numerical dependencies
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 numba==0.60.0 h5py==3.16.0 pydantic==2.11.9 psutil shapely==2.1.2
          python -c "import numpy,scipy; assert numpy.__version__=='1.26.4' and scipy.__version__=='1.14.1'"
      - name: Checkout exact independent MFEM source
        run: |
          git clone https://github.com/mfem/mfem.git _mfem-src
          git -C _mfem-src checkout d964264cdb9a13e94a201b6c236c7721e0c8765f
          if ((git -C _mfem-src rev-parse HEAD).Trim() -ne 'd964264cdb9a13e94a201b6c236c7721e0c8765f') { throw 'MFEM source mismatch' }
      - name: Build independent serial MFEM reference
        run: |
          $source = (Resolve-Path '_mfem-src').Path
          cmake -S benchmarks/acoustics/r130d_mfem_reference -B _mfem-build -G "Visual Studio 17 2022" -A x64 "-DHTDT_MFEM_SOURCE_DIR=$source"
          cmake --build _mfem-build --config Release --parallel 4
          if (!(Test-Path '_mfem-build/Release/r130d_mfem_sloped_tet_system.exe')) { throw 'MFEM reference binary missing' }
      - name: Independently re-execute 1/2/3 MFEM numerical refinement
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/run_r130d_mfem_reference_replay.py `
            --plan benchmarks/acoustics/r130d_general3d_validation_plan.json `
            --run25-summary benchmarks/acoustics/r130d_general3d_self_convergence_run25_summary.json `
            --mfem-root _mfem-src `
            --mfem-executable _mfem-build/Release/r130d_mfem_sloped_tet_system.exe `
            --work-root _mfem_evidence/work `
            --output _mfem_evidence/reference-replay.json
      - name: Preserve exact replay output even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r130d-mfem-reference-replay
          path: |
            _mfem_evidence/reference-replay.json
            _mfem_evidence/work/**/system.json
          if-no-files-found: warn
          retention-days: 14
