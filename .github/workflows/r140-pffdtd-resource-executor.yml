name: R140 PFFDTD Resource Executor

on:
  pull_request:
    paths:
      - 'backend/src/htdt/cad_pffdtd_resource_estimator.py'
      - 'backend/src/htdt/cad_r140_executor.py'
      - 'backend/src/htdt/cad_multifidelity.py'
      - 'backend/src/htdt/cad_multifidelity_execution.py'
      - 'backend/src/htdt/cad_candidate_wave_execution.py'
      - 'backend/tests/test_cad_pffdtd_resource_estimator.py'
      - 'backend/tests/test_cad_r140_executor.py'
      - 'scripts/run_r140_pffdtd_resource_executor.py'
      - 'scripts/run_r130a_candidate_wave_execution.py'
      - 'docs/ISSUE_101_R140_ACTUAL_EXECUTOR_2026-09-20.md'
      - 'docs/ISSUE_101_R140_PFFDTD_RESOURCE_ESTIMATOR_2026-09-20.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - '.github/workflows/r140-pffdtd-resource-executor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-r140-resource-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install HTDT
        run: python -m pip install -e "./backend[dev]"

      - name: Run estimator and generic executor regressions
        run: |
          python -m pytest \
            backend/tests/test_cad_pffdtd_resource_estimator.py \
            backend/tests/test_cad_r140_executor.py

  bounded-pffdtd-through-r140:
    runs-on: windows-latest
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PFFDTD_SHA: aa319f6c86517cb95aabfae8656277da62c3ead5
      EVIDENCE_OUTPUT: artifacts/r140/pffdtd_resource_executor.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install HTDT and pinned PFFDTD candidate runtime
        run: |
          python -m pip install -e ".\\backend[dev]"
          python -m pip install "numpy==1.26.4" "numba==0.60.0" "scipy==1.14.1" "h5py==3.12.1" "tqdm==4.67.1" "psutil==6.1.1" "memory_profiler==0.61.0"

      - name: Checkout exact PFFDTD candidate implementation
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pffdtd-r140-resource'
          git clone --filter=blob:none https://github.com/bsxfun/pffdtd.git $root
          git -C $root checkout --detach $env:PFFDTD_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:PFFDTD_SHA) {
            throw "PFFDTD checkout mismatch: $actual"
          }
          "PFFDTD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Execute real bounded PFFDTD task through R140
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'r140-pffdtd-resource'
          python scripts\\run_r140_pffdtd_resource_executor.py `
            --upstream-root $env:PFFDTD_ROOT `
            --work-root $work `
            --output $env:EVIDENCE_OUTPUT

      - name: Enforce exact evidence and non-claims
        shell: pwsh
        run: |
          $evidence = Get-Content -Raw $env:EVIDENCE_OUTPUT | ConvertFrom-Json
          if ($evidence.status -ne 'PASS') { throw "R140 resource executor status=$($evidence.status)" }
          if ($evidence.candidate_source_commit_sha -ne $env:PFFDTD_SHA) { throw "candidate implementation mismatch" }
          if ($evidence.estimator_version -ne '1') { throw "estimator version mismatch" }
          if ($evidence.production_solver_selected -ne $false) { throw "production adoption claim is forbidden" }
          if ($evidence.gpu_numerical_equivalence_validated -ne $false) { throw "GPU equivalence claim is forbidden" }
          if ($evidence.owned_room_evidence -ne $false) { throw "owned-room evidence claim is forbidden" }
          if ($evidence.rdc_calls -ne 0) { throw "RDC must remain zero" }
          if ($evidence.cache_resume.second_run_attempts -ne 0) { throw "exact cache/resume did not reuse completed task" }
          if ($evidence.cache_resume.second_run_reused_cache_entries -ne 1) { throw "exact cache/resume evidence missing" }
          Write-Host "R140_PFFDTD_INPUT=$($evidence.candidate_execution_input_sha256)"
          Write-Host "R140_PFFDTD_WORKLOAD=$($evidence.workload_estimate.semantic_sha256)"
          Write-Host "R140_RESOURCE_ESTIMATE=$($evidence.execution_resource_estimate.semantic_sha256)"
          Write-Host "R140_EXECUTION_RESULT=$($evidence.executor_result.semantic_sha256)"

      - name: Upload exact R140 PFFDTD evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r140-pffdtd-resource-executor
          path: artifacts/r140/pffdtd_resource_executor.json
          if-no-files-found: error
