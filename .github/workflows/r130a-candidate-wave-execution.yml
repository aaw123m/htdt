name: R130A Candidate Wave Execution

on:
  pull_request:
    paths:
      - 'backend/src/htdt/cad_candidate_wave_execution.py'
      - 'backend/src/htdt/cad_acoustic_snapshot.py'
      - 'backend/src/htdt/cad_acoustic_snapshot_repository.py'
      - 'backend/src/htdt/cad_acoustic_solver_adapter.py'
      - 'backend/src/htdt/cad_acoustic_solver_dispatch_repository.py'
      - 'backend/src/htdt/cad_acoustic_solver_result.py'
      - 'backend/src/htdt/cad_wave_excitation.py'
      - 'backend/src/htdt/acoustic_pffdtd_adapter.py'
      - 'backend/src/htdt/r120_geometry_compiler.py'
      - 'backend/tests/test_cad_candidate_wave_execution.py'
      - 'scripts/run_r130a_candidate_wave_execution.py'
      - 'docs/R130A_CANDIDATE_WAVE_EXECUTION_2026-09-20.md'
      - 'docs/IMPLEMENTATION_ROADMAP.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - '.github/workflows/r130a-candidate-wave-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-pffdtd-candidate:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PFFDTD_SHA: aa319f6c86517cb95aabfae8656277da62c3ead5
      EVIDENCE_OUTPUT: artifacts/r130a/candidate_wave_execution.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install HTDT and pinned PFFDTD candidate runtime
        run: |
          python -m pip install -e ".\\backend[dev]"
          python -m pip install "numpy==1.26.4" "numba==0.60.0" "scipy==1.14.1" "h5py==3.12.1" "tqdm==4.67.1" "psutil==6.1.1" "memory_profiler==0.61.0"

      - name: Run focused candidate-execution tests
        run: python -m pytest backend\\tests\\test_cad_candidate_wave_execution.py backend\\tests\\test_cad_acoustic_snapshot.py backend\\tests\\test_cad_acoustic_solver_result.py backend\\tests\\test_cad_wave_excitation.py

      - name: Checkout exact PFFDTD candidate implementation
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pffdtd-r130a-candidate'
          git clone --filter=blob:none https://github.com/bsxfun/pffdtd.git $root
          git -C $root checkout --detach $env:PFFDTD_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:PFFDTD_SHA) {
            throw "PFFDTD checkout mismatch: $actual"
          }
          "PFFDTD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Execute bounded READY wave fixture
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'r130a-candidate-wave'
          python scripts\\run_r130a_candidate_wave_execution.py `
            --upstream-root $env:PFFDTD_ROOT `
            --work-root $work `
            --output $env:EVIDENCE_OUTPUT

      - name: Enforce candidate-only evidence semantics
        shell: pwsh
        run: |
          $evidence = Get-Content -Raw $env:EVIDENCE_OUTPUT | ConvertFrom-Json
          if ($evidence.status -ne 'PASS') { throw "candidate execution status=$($evidence.status)" }
          if ($evidence.dispatch_state -ne 'READY') { throw "dispatch was not READY" }
          if ($evidence.production_solver_selected -ne $false) { throw "production adoption claim is forbidden" }
          if ($evidence.r100b_completed -ne $false) { throw "R100B completion claim is forbidden" }
          if ($evidence.r130a_numerical_acceptance_completed -ne $false) { throw "R130A acceptance claim is forbidden" }
          if ($evidence.owned_room_evidence -ne $false) { throw "owned-room evidence claim is forbidden" }
          if ($evidence.rdc_calls -ne 0) { throw "RDC must remain zero" }
          Write-Host "R130A_CANDIDATE_INPUT=$($evidence.candidate_execution_input_sha256)"
          Write-Host "R130A_RESULT=$($evidence.result_sha256)"
          Write-Host "R130A_RAW_SOLVER_ASSET=$($evidence.raw_solver_asset_sha256)"

      - name: Upload exact candidate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r130a-candidate-wave-execution
          path: |
            artifacts/r130a/candidate_wave_execution.json
          if-no-files-found: error
