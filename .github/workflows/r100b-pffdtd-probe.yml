name: R100B PFFDTD Python CPU Probe

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_bakeoff.py'
      - 'benchmarks/acoustics/r100a_manifest.json'
      - 'benchmarks/acoustics/r100b_candidates.json'
      - 'scripts/run_r100b_pffdtd_probe.py'
      - '.github/workflows/r100b-pffdtd-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-python-cpu-smoke:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PFFDTD_SHA: aa319f6c86517cb95aabfae8656277da62c3ead5
      PROBE_OUTPUT: artifacts/r100b/pffdtd_python_cpu_windows_smoke.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install HTDT and pinned PFFDTD probe runtime
        run: |
          python -m pip install -e ".\backend"
          python -m pip install "numpy==1.26.4" "numba==0.60.0" "scipy==1.14.1" "h5py==3.12.1" "tqdm==4.67.1" "psutil==6.1.1" "memory_profiler==0.61.0"

      - name: Checkout pinned PFFDTD source
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pffdtd-r100b'
          git clone --filter=blob:none https://github.com/bsxfun/pffdtd.git $root
          git -C $root checkout --detach $env:PFFDTD_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:PFFDTD_SHA) {
            throw "PFFDTD checkout mismatch: $actual"
          }
          "PFFDTD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run PFFDTD Python NumPy/Numba CPU smoke
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'pffdtd-r100b-work'
          python scripts\run_r100b_pffdtd_probe.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --upstream-root $env:PFFDTD_ROOT `
            --work-dir $work `
            --output $env:PROBE_OUTPUT

      - name: Show PFFDTD probe outcome
        shell: pwsh
        run: |
          $probe = Get-Content -Raw $env:PROBE_OUTPUT | ConvertFrom-Json
          Write-Host "R100B_PFFDTD_PROBE_OUTCOME=$($probe.probe_outcome)"
          Write-Host "R100B_R100A_HASH=$($probe.r100a_semantic_hash)"
          Write-Host "R100B_CANDIDATE_HASH=$($probe.candidate_manifest_hash)"
          if ($null -ne $probe.details.measurements) {
            Write-Host "R100B_PFFDTD_SETUP_S=$($probe.details.measurements.setup_s)"
            Write-Host "R100B_PFFDTD_SOLVE_S=$($probe.details.measurements.solve_s)"
            Write-Host "R100B_PFFDTD_PEAK_RAM_MB=$($probe.details.measurements.peak_ram_mb)"
          }
          if ($null -ne $probe.error) {
            Write-Host "R100B_PFFDTD_ERROR=$($probe.error)"
          }

      - name: Upload R100B PFFDTD evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r100b-pffdtd-python-cpu-windows-smoke
          path: artifacts/r100b/pffdtd_python_cpu_windows_smoke.json
          if-no-files-found: error
