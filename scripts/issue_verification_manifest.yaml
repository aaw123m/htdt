  - issue: 725
    title: "REV59-DEPS: evidence attestation / trusted timestamp authority"
    notes: >
      SignedManifestRecord (sigman-) seals the canonical manifest
      identity — the exact signed bytes' digest, canonicalization
      procedure + version, subject pins, exact approval scope.
      EvidenceAttestation (attest-) binds manifest + signer under a
      distinct kind taxonomy (hash_only / mac_authenticated /
      digitally_signed / digitally_signed_with_certificate_chain /
      trusted_timestamp_only / signed_and_trusted_timestamped /
      external_signature_reference) — never a generic signed flag; key
      material is never persisted (signature_sha256 + key_id only).
      evaluate_attestation consumes declared check results under a
      pinned policy: manifest/attestation binding mismatch or
      unsupported digest policy -> verification_failed; hash_only ->
      integrity_confirmed; trusted_timestamp_only ->
      timestamp_confirmed; unchecked signature ->
      attested_unprovened; verified signature without token ->
      attested_verified_declared_time; verified + trusted timestamp ->
      attested_verified; expired/revoked key anchored by trusted time
      -> attested_verified_historical; external references ->
      unverifiable. Attestation chains supported via
      attests_attestation_ref.
