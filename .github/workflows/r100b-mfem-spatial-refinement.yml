name: R100B MFEM Spatial H-Refinement

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_bakeoff_mfem_spatial_experiment.py'
      - 'backend/tests/test_acoustic_bakeoff_mfem_spatial_experiment.py'
      - 'benchmarks/acoustics/r100b_mfem_spatial_refinement_plan.json'
      - 'benchmarks/acoustics/mfem_probe/CMakeLists.txt'
      - 'benchmarks/acoustics/mfem_probe/rectangular_semidiscrete.cpp'
      - 'scripts/run_r100b_mfem_spatial_refinement.py'
      - '.github/workflows/r100b-mfem-spatial-refinement.yml'
  workflow_dispatch:

concurrency:
  group: r100b-mfem-spatial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-mfem-spatial:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: backend/src
      MFEM_SHA: d964264cdb9a13e94a201b6c236c7721e0c8765f
      EXPERIMENT_DIR: artifacts/r100b/mfem_spatial_refinement
      EXPERIMENT_REPORT: artifacts/r100b/mfem_spatial_refinement/report.json
      READINESS_RECORD: artifacts/r100b/mfem_spatial_refinement/readiness_record.json
      PROVENANCE: artifacts/r100b/mfem_spatial_refinement/provenance.json
      HTDT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused numerical runtime
        run: python -m pip install -e ".\backend[dev]" psutil numpy==2.1.3 scipy==1.14.1

      - name: Run focused spatial and PR289 regression tests
        run: python -m pytest backend\tests\test_acoustic_bakeoff_mfem_spatial_experiment.py backend\tests\test_acoustic_bakeoff_mfem_transient_experiment.py

      - name: Preflight spatial experiment runner
        run: python -m py_compile scripts\run_r100b_mfem_spatial_refinement.py

      - name: Checkout exact MFEM candidate
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mfem-r100b-spatial'
          git clone --filter=blob:none https://github.com/mfem/mfem.git $root
          git -C $root checkout --detach $env:MFEM_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:MFEM_SHA) { throw "MFEM checkout mismatch: $actual" }
          "MFEM_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and build rectangular semidiscrete exporter
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'mfem-r100b-spatial-build'
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cmake -S benchmarks\acoustics\mfem_probe -B $build -A x64 -DHTDT_MFEM_SOURCE_DIR="$env:MFEM_ROOT" -DMFEM_USE_EXCEPTIONS=ON
          if ($LASTEXITCODE -ne 0) {
            $timer.Stop()
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM v4.10 serial configure failed for spatial refinement experiment." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BUILD_S=$($timer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          cmake --build $build --config Release --target r100b_mfem_rectangular_semidiscrete --parallel 4
          $exit = $LASTEXITCODE
          $timer.Stop()
          "MFEM_BUILD_S=$($timer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($exit -ne 0) {
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM rectangular semidiscrete target build failed." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          $exe = Get-ChildItem -Path $build -Recurse -Filter 'r100b_mfem_rectangular_semidiscrete.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM rectangular semidiscrete executable missing after successful build." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          "MFEM_RUNTIME_AVAILABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MFEM_PROBE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run authoritative frozen h0-h1-h2 experiment
        if: env.MFEM_RUNTIME_AVAILABLE == '1'
        shell: pwsh
        run: python scripts\run_r100b_mfem_spatial_refinement.py --manifest benchmarks\acoustics\r100a_manifest.json --candidates benchmarks\acoustics\r100b_candidates.json --plan benchmarks\acoustics\r100b_mfem_spatial_refinement_plan.json --adoption-profile benchmarks\acoustics\r100b_wave_adoption_profile.json --readiness-ledger benchmarks\acoustics\r100b_production_adoption_evidence.json --mfem-root $env:MFEM_ROOT --executable $env:MFEM_PROBE_EXE --work-dir "$env:EXPERIMENT_DIR\raw" --output $env:EXPERIMENT_REPORT --readiness-record-output $env:READINESS_RECORD --provenance-output $env:PROVENANCE --native-build-s $env:MFEM_BUILD_S

      - name: Record setup/build RESOURCE_BLOCKED evidence
        if: env.MFEM_RUNTIME_AVAILABLE != '1'
        shell: pwsh
        run: python scripts\run_r100b_mfem_spatial_refinement.py --manifest benchmarks\acoustics\r100a_manifest.json --candidates benchmarks\acoustics\r100b_candidates.json --plan benchmarks\acoustics\r100b_mfem_spatial_refinement_plan.json --adoption-profile benchmarks\acoustics\r100b_wave_adoption_profile.json --readiness-ledger benchmarks\acoustics\r100b_production_adoption_evidence.json --mfem-root $env:MFEM_ROOT --work-dir "$env:EXPERIMENT_DIR\raw" --output $env:EXPERIMENT_REPORT --readiness-record-output $env:READINESS_RECORD --provenance-output $env:PROVENANCE --native-build-s $env:MFEM_BUILD_S --blocked-reason "$env:MFEM_BLOCK_REASON"

      - name: Show decision-separated numerical evidence
        shell: pwsh
        run: |
          $r = Get-Content -Raw $env:EXPERIMENT_REPORT | ConvertFrom-Json
          Write-Host "R100B_SPATIAL_WORKFLOW=$($r.workflow_execution)"
          Write-Host "R100B_SPATIAL_OUTCOME=$($r.experiment_outcome)"
          Write-Host "R100B_SPATIAL_CONVERGENCE=$($r.spatial_numerical_convergence)"
          Write-Host "R100B_SPATIAL_R100A_TOLERANCE=$($r.current_r100a_fixture_tolerance)"
          Write-Host "R100B_SPATIAL_RESOURCE=$($r.resource_suitability)"
          Write-Host "R100B_SPATIAL_TYPED_EVIDENCE=$($r.typed_evidence_admissibility)"
          Write-Host "R100B_SPATIAL_CANDIDATE_READINESS=$($r.candidate_wide_readiness)"
          Write-Host "R100B_SPATIAL_PRODUCTION_SOLVER_SELECTED=$($r.production_solver_selection)"
          Write-Host "R100B_SPATIAL_PLAN_SHA256=$($r.frozen_plan_sha256)"
          Write-Host "R100B_SPATIAL_REPORT_IDENTITY=$($r.deterministic_report_identity_sha256)"
          foreach ($level in $r.level_results) {
            Write-Host ("R100B_SPATIAL_LEVEL=h$($level.refinement) status=$($level.status) elements=$($level.element_count) dofs=$($level.dof_count) Mnnz=$($level.mass_nnz) Knnz=$($level.stiffness_nnz) solve_s=$($level.total_solve_s) rss_mb=$($level.peak_rss_mb) internal_steps=$($level.internal_step_count)")
          }
          foreach ($pair in $r.adjacent_complex_metrics) {
            Write-Host ("R100B_SPATIAL_ADJACENT=h$($pair.coarse_refinement)->h$($pair.fine_refinement) abs=$($pair.complex_rms_absolute) rel=$($pair.complex_rms_relative)")
          }
          Write-Host ("R100B_SPATIAL_READINESS_RECORD=" + (Get-Content -Raw $env:READINESS_RECORD | ConvertFrom-Json | ConvertTo-Json -Depth 20 -Compress))

      - name: Upload immutable spatial refinement evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r100b-mfem-spatial-refinement
          path: artifacts/r100b/mfem_spatial_refinement
          if-no-files-found: error
          retention-days: 90
