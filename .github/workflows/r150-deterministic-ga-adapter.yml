name: R150 Deterministic GA Adapter

on:
  pull_request:
    paths:
      - 'backend/src/htdt/cad_geometric_acoustics_adapter.py'
      - 'backend/tests/test_cad_geometric_acoustics_adapter.py'
      - 'docs/R150_DETERMINISTIC_GA_ADAPTER.md'
      - '.github/workflows/r150-deterministic-ga-adapter.yml'
  workflow_dispatch:

jobs:
  focused-authority-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused HTDT test runtime
        run: python -m pip install pydantic==2.13.4 shapely==2.1.2 pytest==9.1.1

      - name: Run deterministic GA authority fixtures
        run: |
          python -m pytest backend/tests/test_cad_geometric_acoustics_adapter.py \
            --ignore-glob='*does-not-exist*'

  pyroomacoustics-candidate-execution:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused candidate runtime
        run: |
          python -m pip install pydantic==2.13.4 shapely==2.1.2 pytest==9.1.1
          python -m pip install pyroomacoustics==0.10.1
          python -c "import importlib.metadata as m; assert m.version('pyroomacoustics') == '0.10.1'"

      - name: Execute actual pyroomacoustics direct/first-specular adapter fixture
        run: |
          python -m pytest \
            backend/tests/test_cad_geometric_acoustics_adapter.py::test_actual_pyroomacoustics_candidate_executes_same_direct_first_reflection_fixture
