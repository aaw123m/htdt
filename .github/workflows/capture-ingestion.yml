name: Capture ingestion

on:
  pull_request:
    paths:
      - "backend/src/htdt/raw_mesh.py"
      - "backend/src/htdt/capture_bundle.py"
      - "backend/src/htdt/capture_reference.py"
      - "backend/src/htdt/capture_schema_eval.py"
      - "backend/src/htdt/capture_binary_formats.py"
      - "backend/src/htdt/capture_contract/**"
      - "backend/src/htdt/capture_mesh_ingestion.py"
      - "backend/src/htdt/capture_ingestion_transaction.py"
      - "backend/src/htdt/capture_semantic_promotion.py"
      - "backend/src/htdt/capture_import.py"
      - "backend/src/htdt/capture_authoring.py"
      - "backend/tests/capture_fixture_support.py"
      - "backend/tests/test_raw_mesh.py"
      - "backend/tests/test_capture_mesh_ingestion.py"
      - "backend/tests/test_capture_ingestion_transaction.py"
      - "backend/tests/test_capture_ingestion_dedup.py"
      - "backend/tests/test_capture_semantic_promotion.py"
      - "backend/tests/test_capture_compat_pinned.py"
      - "backend/tests/fixtures/capture/**"
      - "docs/CAPTURE_COMPATIBILITY.json"
      - ".github/workflows/capture-ingestion.yml"
  push:
    branches:
      - main
    paths:
      - "backend/src/htdt/raw_mesh.py"
      - "backend/src/htdt/capture_bundle.py"
      - "backend/src/htdt/capture_reference.py"
      - "backend/src/htdt/capture_schema_eval.py"
      - "backend/src/htdt/capture_binary_formats.py"
      - "backend/src/htdt/capture_contract/**"
      - "backend/src/htdt/capture_mesh_ingestion.py"
      - "backend/src/htdt/capture_ingestion_transaction.py"
      - "backend/src/htdt/capture_semantic_promotion.py"
      - "backend/src/htdt/capture_import.py"
      - "backend/src/htdt/capture_authoring.py"
      - "backend/tests/capture_fixture_support.py"
      - "backend/tests/test_raw_mesh.py"
      - "backend/tests/test_capture_mesh_ingestion.py"
      - "backend/tests/test_capture_ingestion_transaction.py"
      - "backend/tests/test_capture_ingestion_dedup.py"
      - "backend/tests/test_capture_semantic_promotion.py"
      - "backend/tests/test_capture_compat_pinned.py"
      - "backend/tests/fixtures/capture/**"
      - "docs/CAPTURE_COMPATIBILITY.json"
      - ".github/workflows/capture-ingestion.yml"

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install "pydantic==2.13.4" "pytest==9.1.1" "shapely==2.1.2"
      - name: Report pinned HTDT-Capture compatibility target
        run: >-
          python -c
          "import json,pathlib;r=json.loads(pathlib.Path('docs/CAPTURE_COMPATIBILITY.json').read_text());print('pinned HTDT-Capture commit:',r['upstream']['pinned_commit']);print('fixture bundle digest:',r['fixture']['bundle_digest']);print('expected lineage digest:',r['expectations']['lineage_digest'])"

      - name: Run cross-repo pinned compatibility gate
        env:
          PYTHONPATH: backend/src
        run: >-
          python -m pytest -q
          backend/tests/test_capture_compat_pinned.py

      - name: Run raw mesh and capture ingestion tests
        env:
          PYTHONPATH: backend/src
        run: >-
          python -m pytest -q
          backend/tests/test_raw_mesh.py
          backend/tests/test_capture_mesh_ingestion.py
          backend/tests/test_capture_ingestion_transaction.py
          backend/tests/test_capture_ingestion_dedup.py
          backend/tests/test_capture_semantic_promotion.py
