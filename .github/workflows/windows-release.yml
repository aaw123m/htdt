name: Windows Release Artifact

on:
  pull_request:
    paths:
      - "assets/branding/**"
      - "backend/**"
      - "scripts/build-native.ps1"
      - "scripts/build-installer.ps1"
      - "scripts/check_dependency_lock.py"
      - "scripts/Get-HtdtVersion.ps1"
      - "scripts/native_entry.py"
      - "scripts/prepare_branding_assets.py"
      - "scripts/validate_backup_pc_migration_windows.py"
      - "installer/**"
      - ".github/workflows/windows-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pinned release toolchain: the lock was generated on CPython 3.12.10
      # (see backend/requirements-n05-windows.lock) and the packaged wheel
      # closure targets CPython 3.12 on Windows x64. build-native.ps1 and the
      # locked-closure test below both consume this interpreter via PATH.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Test backend under shipped dependency closure
        shell: pwsh
        run: |
          # The release gate must exercise the exact third-party closure that
          # ships: create a clean venv on the pinned interpreter, install the
          # hash-verified lock, then overlay only the pinned dev test harness
          # (backend[dev] extras). pytest imports htdt from backend/src via the
          # pytest pythonpath config — the same source PyInstaller packages.
          python --version
          $venv = Join-Path $env:RUNNER_TEMP "htdt-shipped-closure"
          python -m venv $venv
          $py = Join-Path $venv "Scripts\python.exe"
          & $py -m pip install --disable-pip-version-check --require-hashes -r backend\requirements-n05-windows.lock
          if ($LASTEXITCODE -ne 0) { throw "Locked dependency install failed with exit code $LASTEXITCODE" }
          & $py -m pip install --disable-pip-version-check -e ".\backend[dev]"
          if ($LASTEXITCODE -ne 0) { throw "Test harness install failed with exit code $LASTEXITCODE" }
          & $py -m pytest backend\tests
          if ($LASTEXITCODE -ne 0) { throw "Backend tests failed under the shipped closure (exit code $LASTEXITCODE)" }
          # The dev harness overlay must never move a locked package.
          & $py scripts\check_dependency_lock.py --verify-installed
          if ($LASTEXITCODE -ne 0) { throw "Installed closure diverged from the lock" }

      - name: Build locked native package
        shell: pwsh
        run: |
          .\scripts\build-native.ps1 -OutputDir "$env:RUNNER_TEMP\htdt-package" -PythonExe (Get-Command python).Source

      - name: Smoke packaged maintenance CLI
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "htdt-package\HTDT\HTDT.exe"
          $icon = Join-Path $env:RUNNER_TEMP "htdt-package\HTDT\HTDT.ico"
          if (-not (Test-Path $exe)) { throw "Missing packaged executable: $exe" }
          if (-not (Test-Path $icon)) { throw "Missing packaged HTDT icon: $icon" }

          # The packaged app is windowed, so a crashed invocation would otherwise
          # surface as a fatal dialog on the invisible runner desktop and block
          # Start-Process -Wait forever. Bound every invocation and dump the
          # app's diagnostics log on failure.
          function Invoke-Htdt {
            param(
              [string]$Label,
              [string[]]$Arguments,
              [string]$DataRoot = $null,
              [int]$TimeoutSeconds = 300
            )
            $process = Start-Process -FilePath $exe -ArgumentList $Arguments -PassThru
            if (-not $process.WaitForExit($TimeoutSeconds * 1000)) {
              $process.Kill()
              throw "Packaged $Label timed out after ${TimeoutSeconds}s"
            }
            if ($process.ExitCode -ne 0) {
              if ($DataRoot) {
                $log = Join-Path $DataRoot "diagnostics\htdt-native.log"
                if (Test-Path $log) { Get-Content $log -Tail 80 | Write-Output }
              }
              throw "Packaged $Label failed with exit code $($process.ExitCode)"
            }
          }

          Invoke-Htdt -Label "--version" -Arguments @("--version")

          # Seed a fresh data root: exercises --seed-synthetic-demo and produces
          # a real versioned HTDT database for the backup round-trip below. A
          # bare marker-only database is rejected by schema compatibility checks.
          $dataRoot = Join-Path $env:RUNNER_TEMP "htdt-maintenance-data"
          $database = Join-Path $dataRoot "cad-scenes.sqlite3"
          $backup = Join-Path $env:RUNNER_TEMP "htdt-maintenance.htdt-backup"
          Invoke-Htdt -Label "--seed-synthetic-demo" -DataRoot $dataRoot -Arguments @(
            "--data-dir", $dataRoot,
            "--seed-synthetic-demo"
          )
          if (-not (Test-Path $database)) {
            throw "Packaged synthetic demo did not create its database"
          }

          @'
          import sqlite3, sys
          path = sys.argv[1]
          with sqlite3.connect(path) as connection:
              connection.execute("CREATE TABLE ci_marker(value TEXT NOT NULL)")
              connection.execute("INSERT INTO ci_marker(value) VALUES ('baseline')")
          '@ | python - $database

          Invoke-Htdt -Label "--backup" -DataRoot $dataRoot -Arguments @(
            "--data-dir", $dataRoot,
            "--backup", $backup
          )
          if (-not (Test-Path $backup)) {
            throw "Packaged backup did not create an archive"
          }

          @'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as connection:
              connection.execute("UPDATE ci_marker SET value='modified'")
          '@ | python - $database

          Invoke-Htdt -Label "--restore" -DataRoot $dataRoot -Arguments @(
            "--data-dir", $dataRoot,
            "--restore", $backup
          )

          $restored = @'
          import sqlite3, sys
          with sqlite3.connect(sys.argv[1]) as connection:
              print(connection.execute("SELECT value FROM ci_marker").fetchone()[0])
          '@ | python - $database
          if ($restored.Trim() -ne "baseline") {
            throw "Packaged restore did not recover the baseline database"
          }

      - name: Validate packaged old-PC to new-PC migration
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "htdt-package\HTDT\HTDT.exe"
          python .\scripts\validate_backup_pc_migration_windows.py `
            --exe $exe `
            --work-dir "$env:RUNNER_TEMP\htdt-pc-migration"

      - name: Upload PC migration acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HTDT-windows-pc-migration-acceptance
          path: ${{ runner.temp }}\htdt-pc-migration\pc-migration-report.json
          if-no-files-found: error

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
            throw "Chocolatey Inno Setup install failed with exit code $LASTEXITCODE"
          }

      - name: Build per-user installer
        shell: pwsh
        run: |
          .\scripts\build-installer.ps1 `
            -PackageDir "$env:RUNNER_TEMP\htdt-package\HTDT" `
            -OutputDir "$env:RUNNER_TEMP\htdt-installer"

      - name: Verify release identity
        shell: pwsh
        run: |
          # Canonical application version (single source: htdt.__version__).
          $canonical = & .\scripts\Get-HtdtVersion.ps1

          # The packaged executable reports its version from this manifest
          # (bundled via --add-data htdt_build), so it is the exe's own
          # reported identity even though the windowed exe emits no stdout.
          $buildInfoPath = Join-Path $env:RUNNER_TEMP "htdt-package\HTDT\_internal\htdt_build\build_info.json"
          if (-not (Test-Path $buildInfoPath)) {
            throw "Packaged build info missing: $buildInfoPath"
          }
          $buildInfo = Get-Content $buildInfoPath -Raw | ConvertFrom-Json
          if ($buildInfo.version -ne $canonical) {
            throw "Packaged version '$($buildInfo.version)' diverges from canonical htdt.__version__ '$canonical'"
          }
          $headSha = (& git rev-parse HEAD).Trim()
          if ($buildInfo.commit_sha -ne $headSha) {
            throw "Packaged commit '$($buildInfo.commit_sha)' does not match checked-out source '$headSha'"
          }

          $expectedDisplay = "$canonical+g$($buildInfo.commit_sha.Substring(0, 8))"
          if ($buildInfo.dirty) { $expectedDisplay = "$expectedDisplay.dirty" }
          $installer = Get-ChildItem "$env:RUNNER_TEMP\htdt-installer\HTDT-Setup-*.exe" |
            Select-Object -First 1
          if (-not $installer) { throw "Installer artifact missing" }
          if ($installer.Name -ne "HTDT-Setup-$expectedDisplay.exe") {
            throw "Installer '$($installer.Name)' does not match executable-reported version '$expectedDisplay'"
          }

          $manifestPath = Join-Path $env:RUNNER_TEMP "htdt-installer\HTDT-Setup-$expectedDisplay.manifest.json"
          if (-not (Test-Path $manifestPath)) { throw "Release manifest missing: $manifestPath" }
          $release = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($release.application_version -ne $canonical -or
              $release.display_version -ne $expectedDisplay -or
              $release.commit_sha -ne $headSha) {
            throw "Release manifest identity does not match the packaged build"
          }
          $installerHash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($release.installer.sha256 -ne $installerHash) {
            throw "Release manifest installer SHA-256 mismatch"
          }
          $lockHash = (Get-FileHash "backend\requirements-n05-windows.lock" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($release.lock_file.sha256 -ne $lockHash) {
            throw "Release manifest lock-file SHA-256 mismatch"
          }

          # Toolchain provenance: the packaged build must report the pinned
          # release interpreter, and the manifest must carry it forward.
          $expectedPython = (& python -c "import platform; print(platform.python_version())").Trim()
          if ($buildInfo.python_version -ne $expectedPython) {
            throw "Packaged build used Python '$($buildInfo.python_version)', expected pinned toolchain '$expectedPython'"
          }
          if ($release.toolchain.python -ne $buildInfo.python_version) {
            throw "Release manifest toolchain does not carry the packaged Python version"
          }

      - name: Smoke install and uninstall without deleting user data
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$env:RUNNER_TEMP\htdt-installer\HTDT-Setup-*.exe" |
            Select-Object -First 1
          if (-not $installer) { throw "Installer artifact missing" }

          $installRoot = Join-Path $env:RUNNER_TEMP "HTDT-Installed"
          $dataRoot = Join-Path $env:LOCALAPPDATA "HomeTheaterDigitalTwin"
          New-Item -ItemType Directory -Force -Path $dataRoot | Out-Null
          $sentinel = Join-Path $dataRoot "n90-ci-user-data-sentinel.txt"
          Set-Content -Path $sentinel -Value "retain-me" -NoNewline

          $install = Start-Process -FilePath $installer.FullName -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=$installRoot"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "Installer failed with exit code $($install.ExitCode)"
          }

          $exe = Join-Path $installRoot "HTDT\HTDT.exe"
          if (-not (Test-Path $exe)) { throw "Installed executable missing: $exe" }
          $versionProcess = Start-Process -FilePath $exe -ArgumentList @("--version") -PassThru
          if (-not $versionProcess.WaitForExit(300000)) {
            $versionProcess.Kill()
            throw "Installed --version timed out after 300s"
          }
          if ($versionProcess.ExitCode -ne 0) {
            throw "Installed --version failed with exit code $($versionProcess.ExitCode)"
          }

          $uninstaller = Join-Path $installRoot "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing: $uninstaller" }
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) {
            throw "Uninstall failed with exit code $($uninstall.ExitCode)"
          }
          if (Test-Path $exe) {
            throw "Application executable remains after uninstall"
          }
          if (-not (Test-Path $sentinel)) {
            throw "User data was removed by uninstall"
          }
          Remove-Item -Recurse -Force $dataRoot

      - name: Upload native package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HTDT-windows-package
          path: ${{ runner.temp }}\htdt-package\HTDT
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HTDT-windows-installer
          path: |
            ${{ runner.temp }}\htdt-installer\HTDT-Setup-*.exe
            ${{ runner.temp }}\htdt-installer\HTDT-Setup-*.manifest.json
          if-no-files-found: error
