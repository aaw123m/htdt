    domain (acoustic / digital / electrical / dimensionless / other_declared) and
    a domain-restricted quantity kind — a digital quantity never claims an acoustic
    domain. Absolute levels require value_db + a CadLogReference carrying reference
    value+unit, optional standard profile (iso_80000-8:2020 / aes17:2020 / iec61672
