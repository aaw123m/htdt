- issue: 732
  title: Measurement-microphone angular-response / incidence authority
  notes: 'MeasurementMicrophoneDirectionalProfile (mdpf-) pins calibration field kind
    — angular/directional kinds require a dataset ref with declared angle and frequency
    grids. ReceiverOrientationState (rors-) requires measured yaw under a world-fixed
    frame. evaluate_incidence is frequency-gated: without declared angular evidence
    a free-field calibration stays honest (limited) at any frequency; inside a measured
    grid the verdict is correction_available/measured_grid, outside it limited/derived_extrapolated;
    >45 deg from the correction reference is incompatible; pressure sensitivity is
    never promoted to free-field truth and diffuse measurands need diffuse-field quantities.

    '
