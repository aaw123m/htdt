name: R100B PFFDTD Impedance Reflection

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_bakeoff.py'
      - 'backend/src/htdt/acoustic_bakeoff_observation.py'
      - 'backend/src/htdt/acoustic_pffdtd_impedance_adapter.py'
      - 'backend/tests/test_acoustic_pffdtd_impedance_adapter.py'
      - 'benchmarks/acoustics/r100a_manifest.json'
      - 'benchmarks/acoustics/r100b_candidates.json'
      - 'scripts/run_r100b_pffdtd_impedance.py'
      - '.github/workflows/r100b-pffdtd-impedance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-explicit-impedance-reflection:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
      PFFDTD_SHA: aa319f6c86517cb95aabfae8656277da62c3ead5
      PROBE_OUTPUT: artifacts/r100b/pffdtd_impedance_reflection.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install HTDT and pinned PFFDTD boundary-probe runtime
        run: |
          python -m pip install -e ".\backend[dev]"
          python -m pip install "numpy==1.26.4" "scipy==1.14.1" "h5py==3.12.1" "matplotlib==3.9.2" "psutil==6.1.1"

      - name: Checkout pinned PFFDTD source
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pffdtd-r100b-impedance'
          git clone --filter=blob:none https://github.com/bsxfun/pffdtd.git $root
          git -C $root checkout --detach $env:PFFDTD_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:PFFDTD_SHA) {
            throw "PFFDTD checkout mismatch: $actual"
          }
          "PFFDTD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run focused impedance adapter tests
        run: python -m pytest backend\tests\test_acoustic_pffdtd_impedance_adapter.py -q

      - name: Run explicit impedance/reflection probe
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'pffdtd-r100b-impedance-work'
          python scripts\run_r100b_pffdtd_impedance.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --upstream-root $env:PFFDTD_ROOT `
            --work-dir $work `
            --output $env:PROBE_OUTPUT

      - name: Show candidate evidence without conflating workflow status
        shell: pwsh
        run: |
          $probe = Get-Content -Raw $env:PROBE_OUTPUT | ConvertFrom-Json
          Write-Host "WORKFLOW_SUCCESS_DOES_NOT_IMPLY_CANDIDATE_PASS=true"
          Write-Host "R100B_PFFDTD_IMPEDANCE_OUTCOME=$($probe.probe_outcome)"
          Write-Host "R100B_R100A_HASH=$($probe.r100a_semantic_hash)"
          Write-Host "R100B_CANDIDATE_HASH=$($probe.candidate_manifest_hash)"
          Write-Host "R100B_FIXTURE_STATUS=$($probe.bakeoff_run.fixture_evidence[0].status)"
          if ($null -ne $probe.details.reflection_samples) {
            foreach ($sample in $probe.details.reflection_samples) {
              Write-Host ("R100B_REFLECTION {0} {1}Hz |R|={2} phase_deg={3}" -f `
                $sample.sample_key, $sample.frequency_hz, $sample.magnitude, $sample.phase_deg)
            }
          }
          if ($null -ne $probe.details.resources) {
            Write-Host "R100B_COMPILE_S=$($probe.details.resources.compile_s)"
            Write-Host "R100B_SOLVE_S=$($probe.details.resources.solve_s)"
            Write-Host "R100B_POSTPROCESS_S=$($probe.details.resources.postprocess_s)"
            Write-Host "R100B_PEAK_RAM_MB=$($probe.details.resources.peak_ram_mb)"
            Write-Host "R100B_DISK_MB=$($probe.details.resources.disk_mb)"
          }
          if ($null -ne $probe.error) {
            Write-Host "R100B_PFFDTD_IMPEDANCE_BLOCKED_REASON=$($probe.error)"
          }

      - name: Upload R100B PFFDTD impedance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r100b-pffdtd-impedance-reflection
          path: artifacts/r100b/pffdtd_impedance_reflection.json
          if-no-files-found: error
