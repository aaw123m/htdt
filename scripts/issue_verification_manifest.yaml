  notes: 'ArchiveSnapshot (arc-) seals the archival unit — schema version at capture,
    content hash, snapshot semantic checksum, preservation scope (full_semantics_and_provenance
    / evidence_provenance_only / measurement_data_only / project_structure_only /
    other_declared), write procedure pin and declared readback procedure pin (OAIS
    fixity + representation information). ArchiveVerification (arcver-) is the sealed
    re-read verdict: any failed check -> verification_failed; a required check not
    run -> partially_verified; no checks -> unverified. MigrationRecord (mig-) pins
