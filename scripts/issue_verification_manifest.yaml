  - issue: 634
    title: "REV57-AUD: listener-area coverage / acoustic-aim qualification"
    notes: >
      CadAcousticAimState keeps cabinet pose / acoustic reference /
      dataset reference / design aim / as-built aim distinct with an
      explicit cabinet→dataset rotation. CadCoverageListenerArea
      carries design/holdout roles (#581/#590 bound) so a single MLP
      trace cannot qualify the area. Predictions bind declared
      sources (measured-3D requires directivity_ref; nominal
      beamwidth is a permanently weaker class), apply transfers once,
      and require #609 timebase for coherent summation. Verdicts:
      agree_within_envelope → predicted_only / field_measured →
      limitations → directivity/occlusion/sampling limited →
      profile_source_ambiguous → indeterminate; envelope only from
      explicit profile (A102 revision owned by #599).
