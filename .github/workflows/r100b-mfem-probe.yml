name: R100B MFEM Rigid Modes Probe

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_bakeoff.py'
      - 'backend/src/htdt/acoustic_bakeoff_observation.py'
      - 'benchmarks/acoustics/r100a_manifest.json'
      - 'benchmarks/acoustics/r100b_candidates.json'
      - 'benchmarks/acoustics/mfem_probe/**'
      - 'scripts/run_r100b_mfem_probe.py'
      - '.github/workflows/r100b-mfem-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-mfem-rigid-modes:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      MFEM_SHA: d964264cdb9a13e94a201b6c236c7721e0c8765f
      PROBE_OUTPUT: artifacts/r100b/mfem_rigid_modes.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install HTDT probe runtime
        run: python -m pip install -e ".\backend" psutil

      - name: Checkout pinned MFEM source
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mfem-r100b'
          git clone --filter=blob:none https://github.com/mfem/mfem.git $root
          git -C $root checkout --detach $env:MFEM_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:MFEM_SHA) {
            throw "MFEM checkout mismatch: $actual"
          }
          "MFEM_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and build serial MFEM rigid-mode probe
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'mfem-r100b-build'
          $timer = [System.Diagnostics.Stopwatch]::StartNew()

          cmake -S benchmarks\acoustics\mfem_probe -B $build -A x64 -DHTDT_MFEM_SOURCE_DIR="$env:MFEM_ROOT"
          if ($LASTEXITCODE -ne 0) {
            $timer.Stop()
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM v4.10 serial CMake configure failed on GitHub-hosted Windows." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BUILD_S=$($timer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          cmake --build $build --config Release --target r100b_mfem_rigid_modes --parallel 4
          $buildExit = $LASTEXITCODE
          $timer.Stop()
          "MFEM_BUILD_S=$($timer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($buildExit -ne 0) {
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM v4.10 serial library/probe build failed on GitHub-hosted Windows." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          $exe = Get-ChildItem -Path $build -Recurse -Filter 'r100b_mfem_rigid_modes.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM build succeeded but the rigid-mode probe executable was not found." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          "MFEM_RUNTIME_AVAILABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MFEM_PROBE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run MFEM rigid analytical-mode reference
        if: env.MFEM_RUNTIME_AVAILABLE == '1'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mfem-r100b-work'
          python scripts\run_r100b_mfem_probe.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --mfem-root $env:MFEM_ROOT `
            --executable $env:MFEM_PROBE_EXE `
            --work-dir $work `
            --output $env:PROBE_OUTPUT `
            --build-s $env:MFEM_BUILD_S

      - name: Record blocked MFEM build/reference probe
        if: env.MFEM_RUNTIME_AVAILABLE != '1'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mfem-r100b-work'
          python scripts\run_r100b_mfem_probe.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --mfem-root $env:MFEM_ROOT `
            --work-dir $work `
            --output $env:PROBE_OUTPUT `
            --build-s $env:MFEM_BUILD_S `
            --blocked-reason "$env:MFEM_BLOCK_REASON"

      - name: Show MFEM probe outcome
        shell: pwsh
        run: |
          $probe = Get-Content -Raw $env:PROBE_OUTPUT | ConvertFrom-Json
          Write-Host "R100B_MFEM_PROBE_OUTCOME=$($probe.probe_outcome)"
          Write-Host "R100B_R100A_HASH=$($probe.r100a_semantic_hash)"
          Write-Host "R100B_CANDIDATE_HASH=$($probe.candidate_manifest_hash)"
          if ($null -ne $probe.details.selected_order) {
            Write-Host "R100B_MFEM_SELECTED_ORDER=$($probe.details.selected_order)"
            Write-Host "R100B_MFEM_PEAK_RAM_MB=$($probe.details.peak_ram_mb)"
          }
          if ($null -ne $probe.details.error) {
            Write-Host "R100B_MFEM_ERROR=$($probe.details.error)"
          }

      - name: Upload R100B MFEM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r100b-mfem-rigid-modes
          path: artifacts/r100b/mfem_rigid_modes.json
          if-no-files-found: error
