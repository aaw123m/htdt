[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-theater-digital-twin"
# The package version is derived from htdt.__version__ (see
# src/htdt/__init__.py), which is the single canonical version source.
dynamic = ["version"]
description = "Local measurement and configuration workspace for a home theater digital twin"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.1",
  "shapely==2.1.2",
  "PySide6==6.11.2",
  "pyqtgraph==0.14.0",
  "pyvista==0.49.0",
  "pyvistaqt==0.13.1",
  "vtk==9.7.0",
]

[project.scripts]
htdt-native = "htdt.native_cad:main"
htdt-capture-import = "htdt.capture_import:main"

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]
package = [
  "pyinstaller==6.22.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "htdt.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Pinned Capture Bundle v1 contract assets (support matrix + JSON schemas)
# ship inside the package so the production import path can validate
# untrusted bundles without a runtime checkout of HTDT-Capture.
htdt = ["capture_contract/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
