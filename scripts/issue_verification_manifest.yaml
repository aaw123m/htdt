  - issue: 633
    title: "REV57-DISP: video viewing-environment authority"
    notes: >
      ViewingEnvironmentObservation captures room state separately
      from display output: ambient illuminance, incident light on the
      image surface (never room lux), surround luminance/periphery/
      chromaticity/CCT + spectral evidence class, wall/floor/ceiling
      reflectance + colour, stray-light sources, blinds/door,
      automation scene ref. SurroundState.neutral_chromaticity_declared
      is a measured D65-band check — CCT alone never claims a spectral
      D65 surround (SPECTRAL_EVIDENCE_INSUFFICIENT). Profiles
      (itu_bt2035_reference_hdtv / itu_bt500_* / itu_bt2166_hdr_sdr_
      critical_monitoring / project_defined_* / normal_use_scenario)
      map to explicit requirement sets; hard requirements
      (neutral chromaticity, no stray light, dark room) fail the
      profile when unmet. Broadcast profiles are method profiles —
      non-selected scopes carry NOT_REQUESTED_PROFILE +
      PROFILE_SCOPE_NOTE, so a residential room is never declared
      defective for missing BT.2166. ViewingGeometryObservation binds
      seats; LightingSceneRecord binds automation scenes to captured
      observations; compare_viewing_environments reports changed axes
      (wall repaint → not_comparable) and prior_change_axes marks
      evidence stale independently of the display chain.
    checks:
      - id: disp-viewing-environment
        kind: pytest
        tests:
          - backend/tests/test_rev57_disp.py
        description: >
          VVE10–VVE80 fixtures: BT.2035 dark-theater met, bright-room
          dark_room fail, coloured bias light chromaticity unmet,
          stray-light fail, environment/display separation, side-seat
          geometry binding, per-scene qualification, wall-repaint
          staleness + comparability, CCT-only spectral insufficiency,
          incident-vs-room lux separation, scope notes, normal-use
          capture-only, unbound geometry unknown, repository chain,
          audit replay.
      - id: disp-viewing-environment-remainder
        kind: manual
        description: >
          照度計/分光計 (#611) との計器 sha256 結合、#259 geometry
          survey の seat 結合、照明自動化連携 (scene push)、CEDIA
          RP23/CEB22 住宅プロファイルの要件セット拡張、UI への環境
          評価カード配線は残件。
  - issue: 621
    title: "REV57-AUD: acoustic channel-identity / polarity verification"
    notes: >
      CadChannelIdentityChain binds a logical channel to hop-level
      identity (renderer → DSP → DAC → amp → cable → speaker →
      acoustic endpoint), each hop known/inferred/unknown
      independently — declared-only is never credited. Endpoint
      observations pin the #608 stimulus record; polarity stays in
      five separate layers (physical/DSP/source/acoustic/phase) so a
      DSP workaround verifies as compensated, never rewrites the
      wiring defect. evaluate_channel_identity ladders
      verified/compensated/limitations/mismatch (multiple unexpected
      endpoints → device map → acoustic endpoint → insufficient) /
      polarity_fault / not_driven_by_renderer / stale on AVR-DSP
      reset, firmware, cable service, amp/speaker change, render
      topology.
    checks:
      - id: aud-channel-identity
        kind: pytest
        tests:
          - backend/tests/test_rev57_aud.py
        description: >
          Hop-state rules, stimulus pin, unique constraints,
          acoustic-layer method requirement, timebase for phase
          claims, DSP-inversion contradiction rejection, verdict
          ladder incl. compensated/polarity_fault/stale/not-driven,
          reconciliation ordering, repository roundtrip + tamper
          rejection, audit replay.
      - id: aud-channel-identity-remainder
        kind: manual
        description: >
          チェーン自動生成 (#603/#597 機器グラフからのホップ発見)、
          端点観測の UI 入力フォーム、実測マイク/アレイ計測との
          結合は残件。
  - issue: 628
    title: "REV57-AUD: installed loudspeaker instance-variation authority"
    notes: >
      CadInstanceAcousticEvidence separates model_reference_only
      from per-instance levels (factory_qc / lab / in_room /
      diagnostic / derived) — reference values never silently
      apply to a unit. CadModelToInstanceDelta pins both evidence
      records; compatibility rules block on-axis→3D directivity,
      low-level→large-signal, impedance claims without impedance_zf.
      classify_instance_delta + evaluate_matched_set ladders reach
      confirmed_fault / outlier_detected / matched_within_* /
      no_population_tolerance_available / environment_dependent —
      tolerances explicitly bound only (no invented AES-X241
      limits). Limiting member = furthest from group median.
    checks:
      - id: aud-instance-variation
        kind: pytest
        tests:
          - backend/tests/test_rev57_aud.py
        description: >
          Evidence-level/source coherence, in_room vs free_field
          separation, delta ref pinning + compatibility guards,
          full classification ladder, matched-set ≥2/unique/kind,
          per-metric spreads + limiting-instance attribution,
          unmeasured/untoleranced → no_population_tolerance,
          environment confound path, repository chain, audit replay.
      - id: aud-instance-variation-remainder
