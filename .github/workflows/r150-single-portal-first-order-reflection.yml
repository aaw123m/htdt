name: R150 Single-Portal First-Order Reflection

on:
  pull_request:
    paths:
      - 'backend/src/htdt/cad_geometric_acoustics_adapter.py'
      - 'backend/src/htdt/cad_geometric_acoustics_portal.py'
      - 'backend/src/htdt/cad_geometric_acoustics_response.py'
      - 'backend/tests/test_cad_geometric_acoustics_adapter.py'
      - 'backend/tests/test_cad_geometric_acoustics_response.py'
      - 'docs/R150_SINGLE_PORTAL_FIRST_ORDER_REFLECTION_2026-09-20.md'
      - '.github/workflows/r150-single-portal-first-order-reflection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-portal-reflection:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused HTDT test runtime
        run: python -m pip install pydantic==2.13.4 shapely==2.1.2 pytest==9.1.1

      - name: Run bounded one-Portal reflection fixtures
        run: |
          python -m pytest backend/tests/test_cad_geometric_acoustics_adapter.py \
            -k 'portal_reflection'

      - name: Run reflection plus Portal complex-response regression
        run: |
          python -m pytest backend/tests/test_cad_geometric_acoustics_response.py \
            -k 'one_portal_first_order_reflection'

      - name: Run complete R150 adapter regressions
        run: python -m pytest backend/tests/test_cad_geometric_acoustics_adapter.py

      - name: Run complete R150 response regressions
        run: python -m pytest backend/tests/test_cad_geometric_acoustics_response.py
