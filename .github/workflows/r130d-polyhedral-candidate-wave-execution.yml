name: R130D Polyhedral Candidate Wave Execution

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_pffdtd_polyhedral_geometry.py'
      - 'backend/src/htdt/cad_candidate_wave_execution.py'
      - 'backend/tests/test_acoustic_pffdtd_polyhedral_geometry.py'
      - 'backend/tests/test_cad_candidate_wave_execution.py'
      - 'backend/tests/test_cad_pffdtd_resource_estimator.py'
      - 'backend/tests/test_r120_polyhedral_geometry.py'
      - 'scripts/run_r130d_polyhedral_candidate_wave_execution.py'
      - 'docs/R130D_POLYHEDRAL_CANDIDATE_WAVE_EXECUTION_2026-09-20.md'
      - '.github/workflows/r130d-polyhedral-candidate-wave-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-pffdtd-polyhedral:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PFFDTD_SHA: aa319f6c86517cb95aabfae8656277da62c3ead5
      EVIDENCE_OUTPUT: artifacts/r130d/polyhedral_candidate_wave_execution.json

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install HTDT and pinned PFFDTD candidate runtime
        run: |
          python -m pip install -e ".\backend[dev]"
          python -m pip install "numpy==1.26.4" "numba==0.60.0" "scipy==1.14.1" "h5py==3.12.1" "tqdm==4.67.1" "psutil==6.1.1" "memory_profiler==0.61.0"

      - name: Run focused R120B/R130/R140 regression tests
        run: >
          python -m pytest
          backend\tests\test_r120_polyhedral_geometry.py
          backend\tests\test_acoustic_pffdtd_polyhedral_geometry.py
          backend\tests\test_cad_candidate_wave_execution.py
          backend\tests\test_cad_pffdtd_resource_estimator.py

      - name: Checkout exact PFFDTD candidate implementation
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pffdtd-r130d-candidate'
          git clone --filter=blob:none https://github.com/bsxfun/pffdtd.git $root
          git -C $root checkout --detach $env:PFFDTD_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:PFFDTD_SHA) {
            throw "PFFDTD checkout mismatch: $actual"
          }
          "PFFDTD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Execute bounded exact-polyhedral fixtures
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'r130d-polyhedral-candidate'
          python scripts\run_r130d_polyhedral_candidate_wave_execution.py --upstream-root $env:PFFDTD_ROOT --work-root $work --output $env:EVIDENCE_OUTPUT

      - name: Enforce R130D execution and non-claim gates
        shell: pwsh
        run: |
          $evidence = Get-Content -Raw $env:EVIDENCE_OUTPUT | ConvertFrom-Json
          if ($evidence.status -ne 'PASS') { throw "R130D status=$($evidence.status)" }
          if ($evidence.software_execution_status -ne 'PASS') { throw "software execution did not pass" }
          if ($evidence.rectangular_equivalence.status -ne 'PASS') { throw "rectangular equivalence failed" }
          if ($evidence.general_3d_sensitivity.status -ne 'PASS') { throw "general-3D sensitivity failed" }
          if ($evidence.general_3d_sensitivity.mechanical_box_collapse_gate -ne 'PASS') { throw "box-collapse gate failed" }
          if ($evidence.general_3d_sensitivity.sloped_same_bounding_grid_as_rectangular -ne $true) { throw "sloped same-bbox fixture invalid" }
          if ($evidence.sloped.generated_geometry_sha256 -eq $evidence.rectangular.generated_geometry_sha256) { throw "sloped geometry identity collapsed to box" }
          if ($evidence.concave.generated_geometry_sha256 -eq $evidence.rectangular.generated_geometry_sha256) { throw "concave geometry identity collapsed to box" }
          if ($evidence.sloped.boundary_mask_logical_sha256 -eq $evidence.rectangular.boundary_mask_logical_sha256) { throw "sloped boundary mask collapsed to box" }
          if ($evidence.concave.boundary_mask_logical_sha256 -eq $evidence.rectangular.boundary_mask_logical_sha256) { throw "concave boundary mask collapsed to box" }
          if ($evidence.preflight.stale_snapshot_geometry_rejected -ne $true) { throw "stale R120B authority was not rejected" }
          if ($evidence.preflight.resource_ceiling_rejected_before_backend -ne $true) { throw "resource ceiling preflight missing" }
          if ($evidence.reopen.save_reopen_exact_reresolution -ne $true) { throw "exact reopen failed" }
          if ($evidence.reopen.tampered_artifact_rejected -ne $true) { throw "tamper rejection failed" }
          if ($evidence.general_3d_physics_validation_status -ne 'NOT_VALIDATED') { throw "general-3D physics was overclaimed" }
          if ($evidence.production_solver_selected -ne $false) { throw "production solver adoption claim is forbidden" }
          if ($evidence.gpu_execution -ne $false) { throw "GPU execution claim is forbidden" }
          if ($evidence.portal_execution -ne $false) { throw "Portal execution claim is forbidden" }
          if ($evidence.multi_region_execution -ne $false) { throw "multi-region execution claim is forbidden" }
          if ($evidence.rdc_calls -ne 0) { throw "RDC must remain zero" }
          if ($evidence.htdt_capture_changed -ne $false) { throw "HTDT-Capture must remain unchanged" }
          Write-Host "R130D_RECT_INPUT=$($evidence.rectangular.candidate_execution_input_sha256)"
          Write-Host "R130D_RECT_GRID=$($evidence.rectangular.executed_grid_ref.semantic_hash_sha256)"
          Write-Host "R130D_RECT_RESULT=$($evidence.rectangular.result_sha256)"
          Write-Host "R130D_SLOPED_INPUT=$($evidence.sloped.candidate_execution_input_sha256)"
          Write-Host "R130D_SLOPED_GRID=$($evidence.sloped.executed_grid_ref.semantic_hash_sha256)"
          Write-Host "R130D_SLOPED_RESULT=$($evidence.sloped.result_sha256)"
          Write-Host "R130D_CONCAVE_INPUT=$($evidence.concave.candidate_execution_input_sha256)"
          Write-Host "R130D_CONCAVE_GRID=$($evidence.concave.executed_grid_ref.semantic_hash_sha256)"
          Write-Host "R130D_CONCAVE_RESULT=$($evidence.concave.result_sha256)"

      - name: Upload exact R130D evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r130d-polyhedral-candidate-wave-execution
          path: artifacts/r130d/polyhedral_candidate_wave_execution.json
          if-no-files-found: error
