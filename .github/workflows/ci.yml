name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Intentional difference from the shipped environment (see docs/RELEASING.md):
      # dev CI floats on the latest CPython 3.12.x and freshly resolved transitive
      # dependencies so upstream drift surfaces early. The shipped closure is the
      # hash-pinned backend/requirements-n05-windows.lock installed on CPython
      # 3.12.10 in windows-release.yml, which also runs this same backend suite.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Check shipped dependency lock consistency
        run: python scripts\check_dependency_lock.py

      - name: Install backend
        run: python -m pip install -e ".\backend[dev]"

      - name: Preflight R100B acoustic bakeoff authority
        run: python -m htdt.acoustic_bakeoff preflight --manifest benchmarks\acoustics\r100a_manifest.json --candidates benchmarks\acoustics\r100b_candidates.json --adoption-profile benchmarks\acoustics\r100b_wave_adoption_profile.json

      - name: Validate R100A-3 radiation reference authority
        run: python scripts\check_r100a_radiation_reference.py --manifest benchmarks\acoustics\r100a_manifest.json

      - name: Check backend launcher CLI
        run: python -m htdt --help

      - name: Check native CAD launcher CLI
        run: python -m htdt.native_cad --help

      - name: Smoke O60R inventory CLI
        shell: pwsh
        run: |
          $empty = Join-Path $env:RUNNER_TEMP 'o60r-empty'
          New-Item -ItemType Directory -Force -Path $empty | Out-Null
          python scripts\inventory_o60_owned_room.py --data-dir $empty --skip-rew

      - name: Compile Windows CAD acceptance harnesses
        run: python -m py_compile scripts\validate_n20b_windows.py scripts\validate_n30a_windows.py scripts\validate_n30b_windows.py scripts\validate_n40_windows.py scripts\validate_n40_windows_gate.py scripts\validate_n40_precision_windows.py scripts\validate_n50_windows.py scripts\validate_n60_a12_windows.py scripts\validate_n60_a13_windows.py scripts\validate_n70_windows_base.py scripts\validate_n70_windows.py scripts\benchmark_n70_f5_windows.py scripts\validate_n80_windows.py scripts\validate_n80_o20_roomsim_windows.py scripts\validate_n80c_windows.py scripts\validate_n90_a15_windows.py scripts\audit_o60_owned_room.py scripts\inventory_o60_owned_room.py scripts\validate_backup_pc_migration_windows.py

      - name: Validate PowerShell scripts syntax
        shell: pwsh
        run: |
          Get-ChildItem '.\scripts\*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
              exit 1
            }
          }

      - name: Preflight N60 hardware gate runner
        shell: pwsh
        run: .\scripts\run-n60-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight N70 hardware gate runner
        shell: pwsh
        run: .\scripts\run-n70-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight N80 hardware gate runner
        shell: pwsh
        run: .\scripts\run-n80-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight N80 O20 hardware gate runner
        shell: pwsh
        run: .\scripts\run-n80-o20-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight N80c hardware gate runner
        shell: pwsh
        run: .\scripts\run-n80c-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight N90 hardware gate runner
        shell: pwsh
        run: .\scripts\run-n90-hardware-gate.ps1 -RepoRoot $PWD -PreflightOnly

      - name: Preflight O60R owned-room gate runner
        shell: pwsh
        run: .\scripts\run-o60-owned-room-gate.ps1 -RepoRoot $PWD -PreflightOnly

  windows-tests:
    # The backend suite is sharded across N runners; each shard also uses
    # pytest-xdist within its own runner. Same coverage as the former single
    # serial 'Test backend' step, in a fraction of the wall-clock time.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e ".\backend[dev]"

      - name: Test backend (shard ${{ matrix.shard }}/4)
        shell: pwsh
        run: |
          $files = python scripts\pytest_shard.py backend\tests --num-shards 4 --shard ${{ matrix.shard }}
          python -m pytest $files -n auto --dist loadscope
