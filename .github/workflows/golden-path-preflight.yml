name: golden-path-preflight

# Bounded software-only Golden Path preflight (#877): drives
# create-project -> author room -> bind equipment -> search ->
# development prediction -> proposal revision -> verification plan ->
# synthetic fixture measurement -> audit -> reopen -> backup/restore
# through the product's repository/service seams on a fresh data root,
# and uploads the machine-readable trace as an artifact. Final
# owned-Windows/physical acceptance stays with #723 — this lane proves
# ordinary software composition only.

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'scripts/golden_path_preflight.py'
      - '.github/workflows/golden-path-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'scripts/golden_path_preflight.py'
      - '.github/workflows/golden-path-preflight.yml'
  schedule:
    - cron: '23 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: golden-path-preflight
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install backend
        shell: pwsh
        run: python -m pip install -e backend
      - name: Run Golden Path preflight
        shell: pwsh
        run: >
          python scripts/golden_path_preflight.py
          --work-dir "$env:RUNNER_TEMP/golden-path"
          --trace "$env:RUNNER_TEMP/golden-path-trace.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: golden-path-trace
          path: ${{ runner.temp }}/golden-path-trace.json
          if-no-files-found: warn
