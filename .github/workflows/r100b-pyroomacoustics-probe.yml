name: R100B Pyroomacoustics Probe

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_bakeoff.py'
      - 'backend/src/htdt/acoustic_bakeoff_observation.py'
      - 'benchmarks/acoustics/r100a_manifest.json'
      - 'benchmarks/acoustics/r100b_candidates.json'
      - 'scripts/run_r100b_pyroomacoustics_probe.py'
      - '.github/workflows/r100b-pyroomacoustics-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-reference-probe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PROBE_OUTPUT: artifacts/r100b/pyroomacoustics_direct_first_reflection.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install HTDT probe runtime
        run: python -m pip install -e ".\backend" psutil

      - name: Resolve official pyroomacoustics 0.10.1 Windows wheel
        shell: pwsh
        run: |
          $wheelDir = Join-Path $env:RUNNER_TEMP 'r100b-pyroom-wheel'
          New-Item -ItemType Directory -Force -Path $wheelDir | Out-Null

          python -m pip download --only-binary=:all: --no-deps pyroomacoustics==0.10.1 -d $wheelDir
          if ($LASTEXITCODE -ne 0) {
            "PYROOM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PYROOM_BLOCK_REASON=No official pyroomacoustics 0.10.1 CPython 3.12 Windows wheel was available from the configured package index." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          $wheel = Get-ChildItem -Path $wheelDir -Filter 'pyroomacoustics-0.10.1-*.whl' | Select-Object -First 1
          if ($null -eq $wheel) {
            "PYROOM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PYROOM_BLOCK_REASON=Wheel download returned success but no pyroomacoustics 0.10.1 wheel was found." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          $hash = (Get-FileHash -Algorithm SHA256 -Path $wheel.FullName).Hash.ToLowerInvariant()
          "PYROOM_WHEEL_PATH=$($wheel.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PYROOM_WHEEL_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) {
            "PYROOM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PYROOM_BLOCK_REASON=Official pyroomacoustics 0.10.1 Windows wheel was found but could not be installed with its dependencies." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          "PYROOM_RUNTIME_AVAILABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run numerical direct and first-reflection probe
        if: env.PYROOM_RUNTIME_AVAILABLE == '1'
        shell: pwsh
        run: |
          python scripts\run_r100b_pyroomacoustics_probe.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --output $env:PROBE_OUTPUT `
            --wheel-sha256 $env:PYROOM_WHEEL_SHA256

      - name: Record blocked packaging probe
        if: env.PYROOM_RUNTIME_AVAILABLE != '1'
        shell: pwsh
        run: |
          python scripts\run_r100b_pyroomacoustics_probe.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --output $env:PROBE_OUTPUT `
            --blocked-reason "$env:PYROOM_BLOCK_REASON"

      - name: Show probe outcome
        shell: pwsh
        run: |
          $probe = Get-Content -Raw $env:PROBE_OUTPUT | ConvertFrom-Json
          Write-Host "R100B_PYROOM_PROBE_OUTCOME=$($probe.probe_outcome)"
          Write-Host "R100B_R100A_HASH=$($probe.r100a_semantic_hash)"
          Write-Host "R100B_CANDIDATE_HASH=$($probe.candidate_manifest_hash)"

      - name: Upload R100B pyroomacoustics evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r100b-pyroomacoustics-direct-first-reflection
          path: artifacts/r100b/pyroomacoustics_direct_first_reflection.json
          if-no-files-found: error
