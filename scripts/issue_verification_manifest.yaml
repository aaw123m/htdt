  - issue: 605
    title: "REV56-METRICS: speech-intelligibility (STI) authority"
    notes: >
      Sealed SpeechIntelligibilityProfile (IEC 60268-16:2020+COR1:2025
      and legacy 2011 editions, male/female-legacy weightings),
      STIMeasurement (requires the #580 noise binding), STIPrediction
      (requires the #566 validation pin), and
      DialogueIntelligibilityAssessment (per-seat distribution +
      worst/percentile). MTF path: octave-band MTR -> SNR clip [-15,+15]
      -> TI -> alpha-weighted minus adjacent-band redundancy; IR-derived
      MTR via the energy time function. Before/after comparison is
      INCOMPARABLE on any path/method/profile/noise mismatch.
    checks:
      - id: metrics-sti-authority
        kind: pytest
        tests:
          - backend/tests/test_cad_sti_authority.py
        description: >
          Perfect-transmission STI=1.0 against the published weighting
          tables, sinusoidal and exponential-decay MTR closed forms,
          noise/codec limitation surfacing, simulated-vs-measured
          separation, comparability strictness.
      - id: metrics-sti-ir-integration-remainder
        kind: manual
        description: >
          実測 IR パイプラインからの band-limited ETF 抽出・聴覚マスキング
          項（absolute reception threshold）の完全実装、RA-STI 縮退版は
          残件。閾値の断定は target_class 宣言に限定。
  - issue: 607
    title: "REV56-METRICS: content loudness / normalization authority"
    notes: >
      Sealed ContentLoudnessProfile (BS.1770-5 production /
      BS.1770-2026-draft research-only / AES77-2023 / EBU R128 v5.0),
