# Issue #848 — canonical evidence-aware issue lifecycle metadata.
#
# GitHub open/closed is binary; HTDT's completion model is not. This
# manifest records, per tracked issue: what has landed (exact PR/commit
# refs), what gate kinds remain, and the canonical lifecycle state that
# `scripts/issue_lifecycle.py` classifies and drift-checks.
#
# lifecycle values:
#   planned                        — scoped, no implementation started
#   in_progress                    — implementation underway
#   software_landed                — implementation merged; no gate declared
#   acceptance_remaining           — landed; automated/manual acceptance red
#   physical_evidence_remaining    — landed; physical/owned-room evidence missing
#   structural_followup_remaining  — landed; restructuring/follow-up issues remain
#   complete                       — every declared gate cleared; safe to close
#   withdrawn                      — closed as wontfix/duplicate
#   superseded                     — replaced by a newer issue (record `superseded_by`)
#
# Rules enforced by the checker (never inferred from software tests):
#   - landed states require at least one landed.prs/commits ref
#   - `complete` requires remaining_gates == []
#   - GitHub-closed issues must not carry an active lifecycle
#   - entries in issue_verification_manifest.yaml without a lifecycle
#     record are reported as `unclassified` — never silently assumed.
