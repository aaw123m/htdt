    - backend/tests/test_rev59_loudspk.py::test_member_adjustment_guard
    description: '構成トポロジの個別調整可否、席間均一性の検定要件 （≥2測定席+holdout+和音場証拠）、相殺席・定位低下の 明示 verdict。

