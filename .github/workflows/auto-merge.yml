name: Auto-merge

# Merges pull requests once all their checks pass. A PR is eligible when it
# carries the `automerge` label or is authored by the Devin integration bot.
# The workflow re-evaluates eligibility on every PR event and every completed
# check suite / commit status, and merges eligible+green PRs with a squash
# merge, deleting the head branch afterwards. `workflow_dispatch` allows a
# manual sweep of all open PRs.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  check_suite:
    types: [completed]
  status:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - name: Merge eligible PRs with green checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          BOT_LOGIN="devin-ai-integration[bot]"

          eligible() {
            local pr_number="$1"
            gh pr view "$pr_number" --repo "$REPO" \
              --json labels,author,isDraft,state,headRefOid \
              --jq '(.isDraft == false) and (.state == "OPEN") and
                    ((.author.login == "'"$BOT_LOGIN"'") or
                     ([.labels[].name] | any(. == "automerge")))'
          }

          merge_if_green() {
            local pr_number="$1"
            local ok
            ok=$(eligible "$pr_number") || return 0
            if [ "$ok" != "true" ]; then
              echo "PR #$pr_number: not eligible, skipping"
              return 0
            fi

            local blockers
            blockers=$(gh pr checks "$pr_number" --repo "$REPO" \
              --json name,bucket \
              --jq '[.[] | select(.bucket != "pass" and .bucket != "skipping")] | map(.name + "=" + .bucket) | join(", ")') || {
                echo "PR #$pr_number: could not read checks, skipping"
                return 0
              }
            if [ -n "$blockers" ]; then
              echo "PR #$pr_number: waiting on checks: $blockers"
              return 0
            fi

            echo "PR #$pr_number: all checks green, squash merging"
            gh pr merge "$pr_number" --repo "$REPO" --squash --delete-branch \
              || echo "PR #$pr_number: merge failed (see log above)"
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            merge_if_green "${{ github.event.pull_request.number }}"
          else
            for pr_number in $(gh pr list --repo "$REPO" --state open --limit 100 --json number --jq '.[].number'); do
              merge_if_green "$pr_number"
            done
          fi
