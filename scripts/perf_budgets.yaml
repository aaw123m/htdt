  - operation_id: memory_idle_rss
    fixture_size: medium
    memory_budget_bytes: 2147483648
    rationale: baseline ~0.9GiB (2GiB cap)
  - operation_id: memory_loaded_rss
    fixture_size: medium
    memory_budget_bytes: 2147483648
    rationale: baseline ~0.9GiB with 300 entities (2GiB cap)

  # --- large fixture (1500 entities / 24 revisions) --------------------
  - operation_id: project_open
    fixture_size: large
