  - issue: 646
    title: "Precedence / discrete-echo perceptual-risk authority"
    notes: >
      PrecedenceProfile (prec-) pins stimulus class and listening
      context — echo threshold is stimulus-dependent, 'unknown'
      stimulus fails closed. EchoRiskObservation (erk-) binds
      delay/level/direction to a phenomenon classification (fusion,
      localization dominance, suppression, segregation, image shift).
      evaluate_echo_risk_claim: fixed delay rules →
      fixed_rule_misapplied; no profile → stimulus_unqualified;
      physical data alone → unresolved_risk.
    checks:
      - id: precedence-echo
        kind: pytest
        tests:
          - backend/tests/test_rev59_acoust3.py::test_echo_claim_ladder
          - backend/tests/test_rev59_acoust3.py::test_profile_rejects_unknown_stimulus
        description: No fixed 20ms rule; phenomenon-honest classification.
  - issue: 648
    title: "Acoustic-finish fire / reaction-to-fire evidence authority"
    notes: >
      ReactionToFireEvidence (rtf-) pins test standard (ASTM E84 /
      NFPA 286 / EN 13501-1 / etc.), the tested assembly descriptor and
      the report ref. FinishAssemblySafetyEvidence (fas-) binds that
      evidence to the declared installation assembly parts.
      evaluate_fire_eligibility_claim: acoustic suitability →
      acoustic_not_safety; wrong standard for the requirement →
      test_scope_mismatch; lab result without assembly →
      lab_result_is_not_installation.
    checks:
