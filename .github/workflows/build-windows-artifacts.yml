name: build-windows-artifacts

# Manual packaging pipeline. Produces the same artifacts a local maintainer
# produces with scripts/build-native.ps1 + scripts/build-installer.ps1:
#   - HTDT-Setup-<display_version>.exe      (Inno Setup installer)
#   - HTDT-Setup-<display_version>.manifest.json
#   - HTDT-portable-<display_version>.zip   (portable onedir package)
#   - HTDT-portable-<display_version>.manifest.json
#
# Test verification stays local per repo convention (no PR CI): dispatch this
# only on revisions whose scoped tests are already green. Action SHAs are
# pinned — backend/tests/test_dependency_lock.py fails on floating tags.
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a GitHub Release and attach the artifacts'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Tag for the release (e.g. v0.2.0). Required when publish_release is enabled.'
        required: false
        type: string
        default: ''
      run_software_verification:
        description: 'Run the release-candidate software verification gate (issue #833) before packaging and bind its evidence into the release manifests. Disable only for non-candidate builds — manifests will then record verification.status=unverified.'
        required: false
        type: boolean
        default: true
      require_signature:
        description: 'Authenticode-sign release artifacts (issue #849). Requires HTDT_CODESIGN_PFX_BASE64 + HTDT_CODESIGN_PFX_PASSWORD secrets; fails the build when signing cannot complete.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # needed only for the optional gh release step

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      DISPLAY_VERSION: ''
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython 3.12 (x64)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install backend + test dependencies
        if: inputs.run_software_verification
        shell: pwsh
        run: python -m pip install -e "backend[dev]"

      # Issue #833 gate: one canonical local/manual-first verification run
      # bound to the exact checked-out revision. Evidence (JSON + Markdown +
      # per-check logs) is uploaded below so reviewers can inspect which
      # checks ran; the release manifests bind its sha256. A red gate fails
      # the build — exit 0 means every required class passed.
      - name: Release software verification gate
        if: inputs.run_software_verification
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
          TMPDIR: C:\t
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\t | Out-Null
          python scripts/run_release_verification.py --profile release --report-dir out\release-verification

      - name: Upload verification evidence
        if: inputs.run_software_verification && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # run_attempt keeps re-runs of the same run_number
          # distinguishable — artifact names are immutable once uploaded.
          name: release-verification-${{ github.run_number }}-${{ github.run_attempt }}
          path: out/release-verification/
          if-no-files-found: warn
          retention-days: 90

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build native package (PyInstaller onedir)
        shell: pwsh
        run: .\scripts\build-native.ps1 -PythonExe python

      - name: Resolve display version
        shell: pwsh
        run: |
          $BuildInfo = Get-Content "dist-native\HTDT\_internal\htdt_build\build_info.json" -Raw | ConvertFrom-Json
          $Display = [string]$BuildInfo.version
          if ($BuildInfo.commit_sha) {
            $Display = "$Display+g$($BuildInfo.commit_sha.Substring(0, [Math]::Min(8, $BuildInfo.commit_sha.Length)))"
            if ($BuildInfo.dirty) { $Display = "$Display.dirty" }
          }
          "DISPLAY_VERSION=$Display" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Display version: $Display"

      - name: Create portable zip + manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $OutDir = "dist-installer"
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          $ZipPath = Join-Path $OutDir "HTDT-portable-$env:DISPLAY_VERSION.zip"
          Compress-Archive -Path "dist-native\HTDT\*" -DestinationPath $ZipPath -Force
          if (-not (Test-Path $ZipPath)) { throw "Portable zip missing: $ZipPath" }

          $BuildInfo = Get-Content "dist-native\HTDT\_internal\htdt_build\build_info.json" -Raw | ConvertFrom-Json
          # Same verification binding as the installer manifest (issue #833):
          # green full-coverage evidence binds by sha256; anything else is a
          # visibly non-verified status, never silently "verified".
          . .\scripts\verification_evidence.ps1
          $EvidencePath = ""
          if ("${{ inputs.run_software_verification }}" -eq "true") {
            $EvidencePath = "out\release-verification\release_verification_evidence.json"
          }
          $Verification = Get-VerificationBlock -EvidencePath $EvidencePath `
            -ExpectedCommitSha $BuildInfo.commit_sha `
            -RequireEvidence:([bool]$EvidencePath)
          $Manifest = [ordered]@{
            schema              = "htdt-release-manifest/1"
            application_version = [string]$BuildInfo.version
            display_version     = $env:DISPLAY_VERSION
            commit_sha          = $BuildInfo.commit_sha
            dirty               = [bool]$BuildInfo.dirty
            build_id            = $BuildInfo.build_id
            portable            = [ordered]@{
              file   = Split-Path -Leaf $ZipPath
              sha256 = (Get-FileHash -Algorithm SHA256 $ZipPath).Hash.ToLowerInvariant()
            }
            lock_file           = [ordered]@{
              path   = "backend/requirements-n05-windows.lock"
              sha256 = $BuildInfo.lock_sha256
            }
            toolchain           = [ordered]@{
              python = $BuildInfo.python_version
              pip    = $BuildInfo.pip_version
            }
            verification        = $Verification
            github              = [ordered]@{
              workflow   = $env:GITHUB_WORKFLOW
              run_id     = $env:GITHUB_RUN_ID
              run_number = $env:GITHUB_RUN_NUMBER
              ref        = $env:GITHUB_REF
              sha        = $env:GITHUB_SHA
            }
            generated_at_utc    = (Get-Date).ToUniversalTime().ToString("o")
          }
          $ManifestPath = Join-Path $OutDir "HTDT-portable-$env:DISPLAY_VERSION.manifest.json"
          $Manifest | ConvertTo-Json -Depth 6 | Set-Content -Path $ManifestPath -Encoding utf8
          Write-Host "Built portable package: $ZipPath"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $Args = @("-PackageDir", "dist-native\HTDT", "-OutputDir", "dist-installer")
          if ("${{ inputs.run_software_verification }}" -eq "true") {
            $Args += @("-VerificationEvidence", "out\release-verification\release_verification_evidence.json", "-RequireVerification")
          }
          .\scripts\build-installer.ps1 @Args

      # Issue #849: optional publisher-identity stage. Runs only for an
      # explicitly signature-required dispatch; the cert material lives in
      # org secrets and is deleted again before upload. publisher_signature
      # is merged NEXT TO (never inside) the verification block — signing
      # can never promote software/UX/physical verification states.
      - name: Authenticode signing + manifest merge
        if: inputs.require_signature
        shell: pwsh
        env:
          HTDT_CODESIGN_PFX_BASE64: ${{ secrets.HTDT_CODESIGN_PFX_BASE64 }}
          HTDT_SIGN_PFX_PASSWORD: ${{ secrets.HTDT_CODESIGN_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:HTDT_CODESIGN_PFX_BASE64) {
            throw "require_signature is set but the HTDT_CODESIGN_PFX_BASE64 secret is not configured"
          }
          $Pfx = Join-Path $env:RUNNER_TEMP "htdt-codesign.pfx"
          [IO.File]::WriteAllBytes($Pfx, [Convert]::FromBase64String($env:HTDT_CODESIGN_PFX_BASE64))
          try {
            $Artifacts = Get-ChildItem dist-installer -Filter *.exe | ForEach-Object { $_.FullName }
            if (-not $Artifacts) { throw "No .exe artifacts in dist-installer to sign" }
            .\scripts\sign-release.ps1 -Artifacts $Artifacts -PfxPath $Pfx -RequireSigning
            foreach ($Artifact in $Artifacts) {
              $Base = [IO.Path]::GetFileNameWithoutExtension($Artifact)
              $Dir = Split-Path $Artifact
              $Report = "$Artifact.signature.json"
              $Manifest = Join-Path $Dir "$Base.manifest.json"
              python scripts/release_signature.py --manifest $Manifest --signature-report $Report --artifact $Artifact --require-signed
            }
          } finally {
            Remove-Item $Pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Same-commit re-runs produce the same DISPLAY_VERSION, so the
          # attempt number is required for a unique artifact name.
          name: htdt-windows-${{ env.DISPLAY_VERSION }}-${{ github.run_attempt }}
          path: dist-installer/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:RELEASE_TAG) { throw "release_tag input is required when publish_release is enabled" }
          $Files = Get-ChildItem "dist-installer" -File | ForEach-Object { $_.FullName }
          if (-not $Files) { throw "No artifacts in dist-installer to attach" }
          gh release create $env:RELEASE_TAG $Files `
            --title "HTDT $env:DISPLAY_VERSION" `
            --notes "Windows installer and portable package for HTDT $env:DISPLAY_VERSION (commit $($env:GITHUB_SHA)). Provenance: see the *.manifest.json files attached alongside the binaries." `
            --verify-tag
