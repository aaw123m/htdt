[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "home-theater-digital-twin"
# The package version is derived from htdt.__version__ (see
# src/htdt/__init__.py), which is the single canonical version source.
dynamic = ["version"]
description = "Local measurement and configuration workspace for a home theater digital twin"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.1",
  "shapely==2.1.2",
  "PySide6==6.11.2",
  "pyqtgraph==0.14.0",
  "pyvista==0.49.0",
  "pyvistaqt==0.13.1",
  "vtk==9.7.0",
  # PDF floor-plan underlay pages (#534); imported lazily only when a .pdf
  # file is imported, so image/DXF flows work without it.
  "PyMuPDF==1.26.7",
  # QR encoding for printable field labels (#665); pure-python, no imaging deps.
  "segno==1.6.6",
  # SOFA (netCDF4/HDF5) spatial dataset ingestion (#809); imported lazily only
  # when a .sofa file is loaded.
  "h5py==3.16.0",
  # YAML parsing for CamillaDSP config import (#1072); imported lazily only
  # when a YAML (non-JSON) CamillaDSP source is parsed.
  "PyYAML==6.0.3",
]

[project.scripts]
htdt = "htdt.headless_cli:main"
htdt-native = "htdt.native_cad:main"
htdt-capture-import = "htdt.capture_import:main"
htdt-r130d = "htdt.r130d_cli:main"

[project.optional-dependencies]
acoustic-numerical = [
  "numpy>=1.26,<3",
  "scipy>=1.14,<2",
]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-xdist==3.8.0",
  # tests/test_rev18_acoustic_truth.py imports scipy.signal unconditionally.
  "scipy==1.18.1",
]
package = [
  "pyinstaller==6.22.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "htdt.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Pinned Capture Bundle v1 contract assets (support matrix + JSON schemas)
# ship inside the package so the production import path can validate
# untrusted bundles without a runtime checkout of HTDT-Capture.
htdt = ["capture_contract/*.json", "reference_theater/*.json", "r130d_contract/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
# ".." puts the repository root on sys.path so the repo-level scripts/
# package (e.g. run_r130a_candidate_wave_execution fixtures) resolves.
pythonpath = ["src", ".."]
testpaths = ["tests"]
