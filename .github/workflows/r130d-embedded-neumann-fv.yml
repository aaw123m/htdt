name: R130D experimental cut-cell Neumann solver
on:
  pull_request:
    paths:
      - '.github/workflows/r130d-embedded-neumann-fv.yml'
      - 'backend/src/htdt/r130d_embedded_neumann_fv.py'
      - 'backend/tests/test_r130d_embedded_neumann_fv.py'
      - 'backend/src/htdt/r130d_embedded_neumann_convex.py'
      - 'backend/tests/test_r130d_embedded_convex_cutcell.py'
      - 'backend/tests/test_r130d_convex_multiplane_evidence.py'
      - 'scripts/run_r130d_convex_multiplane_cutcell_diagnostic.py'
      - 'benchmarks/acoustics/r130d_convex_multiplane_cutcell*'
      - 'backend/tests/test_r130d_embedded_neumann_fv_evidence.py'
      - 'backend/tests/test_r130d_fv_mfem_same_drive.py'
      - 'backend/tests/test_r130d_candidate_same_source_qualification.py'
      - 'backend/tests/test_r130d_mfem_ref4_same_drive.py'
      - 'backend/tests/test_r130d_mfem_ref4_same_source_result.py'
      - 'benchmarks/acoustics/r130d_mfem_independent_sparse_systems/mfem-r4.json.gz'
      - 'benchmarks/acoustics/r130d_mfem_ref4_same_drive_v2_evidence_2026-10-09.json'
      - 'benchmarks/acoustics/r130d_candidate_same_source_numerical_pass_2026-10-09.json'
      - 'scripts/run_r130d_mfem_ref4_same_drive.py'
      - 'backend/src/htdt/r130d_candidate_same_source_qualification.py'
      - 'scripts/run_r130d_candidate_same_source_qualification.py'
      - 'benchmarks/acoustics/r130d_candidate_same_source*'
      - 'scripts/run_r130d_fv_mfem_same_drive_comparison.py'
      - 'benchmarks/acoustics/r130d_fv_mfem_same_drive*'
      - 'benchmarks/acoustics/r130d_mfem_independent_sparse_systems/**'
      - 'scripts/run_r130d_embedded_neumann_*.py'
      - 'benchmarks/acoustics/r130d_embedded_neumann_fv_*.json'
# Keep only one budgeted prototype CI run per PR revision.
concurrency:
  group: r130d-neumann-prototype-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  numerical-prototype:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install solver dependencies
        shell: pwsh
        run: |
          python -m pip install numpy==1.26.4 scipy==1.14.1 pydantic==2.11.9 pytest==8.4.2
          python -c "import numpy,scipy;assert numpy.__version__=='1.26.4' and scipy.__version__=='1.14.1'"
      - name: Independent cut-cell operator unit and energy tests
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          New-Item -ItemType Directory scratch/tests -Force | Out-Null
          Copy-Item backend/tests/test_r130d_embedded_neumann_fv.py scratch/tests/
          Copy-Item backend/tests/test_r130d_embedded_convex_cutcell.py scratch/tests/
          Copy-Item backend/tests/test_r130d_convex_multiplane_evidence.py scratch/tests/
          Copy-Item backend/tests/test_r130d_embedded_neumann_fv_evidence.py scratch/tests/
          Copy-Item backend/tests/test_r130d_fv_mfem_same_drive.py scratch/tests/
          Copy-Item backend/tests/test_r130d_candidate_same_source_qualification.py scratch/tests/
          Copy-Item backend/tests/test_r130d_mfem_ref4_same_drive.py scratch/tests/
          Copy-Item backend/tests/test_r130d_mfem_ref4_same_source_result.py scratch/tests/
          $env:PYTHONPATH = Join-Path $pwd 'backend/src'
          python -m pytest -q scratch/tests/test_r130d_embedded_convex_cutcell.py scratch/tests/test_r130d_convex_multiplane_evidence.py scratch/tests/test_r130d_embedded_neumann_fv.py scratch/tests/test_r130d_embedded_neumann_fv_evidence.py scratch/tests/test_r130d_fv_mfem_same_drive.py scratch/tests/test_r130d_candidate_same_source_qualification.py scratch/tests/test_r130d_mfem_ref4_same_drive.py scratch/tests/test_r130d_mfem_ref4_same_source_result.py --tb=short
      - name: Recompute modal benchmark and compare frozen evidence
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/run_r130d_embedded_neumann_benchmark.py --output scratch/ci_modal.json
          @'
          import json
          from pathlib import Path
          a=json.loads(Path('scratch/ci_modal.json').read_text())
          b=json.loads(Path('benchmarks/acoustics/r130d_embedded_neumann_fv_eigen_evidence_2026-10-09.json').read_text())
          assert a['production_pffdtd_modified'] is False
          assert a['cross_solver_eligible'] is False
          for x,y in zip(a['levels'],b['levels']):
              assert x['cells_per_axis']==y['cells_per_axis']
              assert abs(x['integrated_fluid_volume_m3']-56)<1e-10
              assert x['undriven_midpoint_energy']['max_relative_energy_drift']<1e-9
              assert max(abs(p-q) for p,q in zip(x['first_positive_eigenfrequencies_hz'],y['first_positive_eigenfrequencies_hz']))<1e-5
          print('PASS: numerical prototype evidence consistent; production NOT promoted')
          '@ | python -
      - name: Actually drive pinned independent MFEM using permanent byte-verified sparse systems
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/run_r130d_fv_mfem_same_drive_comparison.py `
            --plan benchmarks/acoustics/r130d_fv_mfem_same_drive_plan_2026-10-09.json `
            --mfem-systems benchmarks/acoustics/r130d_mfem_independent_sparse_systems `
            --fv-evidence benchmarks/acoustics/r130d_embedded_neumann_fv_driven_followup_2026-10-09.json `
            --output scratch/ci_same_source_mfem.json
          @'
          import json
          from pathlib import Path
          actual=json.loads(Path('scratch/ci_same_source_mfem.json').read_text())
          frozen=json.loads(Path('benchmarks/acoustics/r130d_fv_mfem_same_drive_evidence_2026-10-09.json').read_text())
          assert actual['gate']['production_ready'] is False
          assert actual['gate']['cross_solver_production_eligible'] is False
          assert actual['gate']['canonical_r130d_self_convergence']=='SELF_CONVERGENCE_FAILED'
          assert len(actual['mfem_levels'])==3 and len(actual['cross_solver_vs_mfem_r3'])==4
          for a,b in zip(actual['mfem_levels'],frozen['mfem_levels']):
              for x,y in zip(a['transfer_complex_40_80_hz'],b['transfer_complex_40_80_hz']):
                  assert abs(complex(*x)-complex(*y)) < 1e-6
          assert abs(actual['cross_solver_vs_mfem_r3'][-1]['normalized_complex_l2'] - 0.08243571292457451) < 1e-7
          print('PASS: actual MFEM drive replay matches immutable independent evidence; production NO_GO')
          '@ | python -
      - name: Re-evaluate preregistered candidate gate; require BLOCKED before r4 is independently accepted
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/run_r130d_candidate_same_source_qualification.py `
            --candidate-plan benchmarks/acoustics/r130d_candidate_same_source_numerical_acceptance_plan_2026-10-09.json `
            --parent-plan benchmarks/acoustics/r130d_general3d_validation_plan.json `
            --fv-evidence benchmarks/acoustics/r130d_embedded_neumann_fv_driven_followup_2026-10-09.json `
            --mfem-r123-evidence benchmarks/acoustics/r130d_fv_mfem_same_drive_evidence_2026-10-09.json `
            --output scratch/ci_candidate_gate_pending_r4.json
          @'
          import json
          r=json.load(open('scratch/ci_candidate_gate_pending_r4.json'))
          assert r['gate']['fv_self_state']=='SELF_CONVERGENCE_PASS_CANDIDATE_ONLY'
          assert r['gate']['mfem_self_state']=='REFINEMENT_R4_MISSING'
          assert r['gate']['cross_solver_state']=='CROSS_SOLVER_BLOCKED'
          assert r['production_ready'] is False
          print('PASS: FV candidate-only self-convergence / missing MFEM ref4 blocks adoption')
          '@ | python -
      - name: Reproduce independent MFEM r4 from immutable compressed original matrix
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/run_r130d_mfem_ref4_same_drive.py `
            --plan benchmarks/acoustics/r130d_mfem_ref4_same_drive_solver_v2_plan_2026-10-09.json `
            --ref4-system benchmarks/acoustics/r130d_mfem_independent_sparse_systems/mfem-r4.json.gz `
            --comparison-evidence benchmarks/acoustics/r130d_fv_mfem_same_drive_evidence_2026-10-09.json `
            --output scratch/ci_r4_same_drive.json
          @'
          import json
          from pathlib import Path
          now=json.loads(Path('scratch/ci_r4_same_drive.json').read_text())
          fixed=json.loads(Path('benchmarks/acoustics/r130d_mfem_ref4_same_drive_v2_evidence_2026-10-09.json').read_text())
          assert now['mfem_dofs']==35937
          assert now['mfem_sparse_export_sha256']==fixed['mfem_sparse_export_sha256']
          assert now['actual_sparse_solver']['max_true_relative_linear_residual'] <= 1e-8
          for a,b in zip(now['transfer_complex_40_80_hz'],fixed['transfer_complex_40_80_hz']):
              assert abs(complex(*a)-complex(*b)) < 1e-6
          assert now['gate']['production_ready'] is False
          print('Independent MFEM r4 actual Gaussian drive replay PASS')
          '@ | python -
      - name: Verify both candidate solver self-gates PASS but legacy production NO_GO
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          python scripts/run_r130d_candidate_same_source_qualification.py `
            --candidate-plan benchmarks/acoustics/r130d_candidate_same_source_numerical_acceptance_plan_2026-10-09.json `
            --parent-plan benchmarks/acoustics/r130d_general3d_validation_plan.json `
            --fv-evidence benchmarks/acoustics/r130d_embedded_neumann_fv_driven_followup_2026-10-09.json `
            --mfem-r123-evidence benchmarks/acoustics/r130d_fv_mfem_same_drive_evidence_2026-10-09.json `
            --mfem-r4-evidence scratch/ci_r4_same_drive.json `
            --output scratch/ci_r130d_candidate_gate.json
          @'
          import json
          from pathlib import Path
          gate=json.loads(Path('scratch/ci_r130d_candidate_gate.json').read_text())['gate']
          assert gate['candidate_numerical_evidence_state']=='EXPERIMENTAL_CANDIDATE_NUMERICAL_PASS_ONLY'
          assert gate['cross_solver_state']=='CROSS_SOLVER_PASS_CANDIDATE_ONLY'
          assert gate['immutable_production_gate']['canonical_r130d_impulse']=='SELF_CONVERGENCE_FAILED'
          assert gate['immutable_production_gate']['production_enabled'] is False
          assert gate['immutable_production_gate']['physical_validation']=='NOT_VALIDATED'
          print('PASS: experimental candidate numerical convergence; production remains forbidden')
          '@ | python -
      - name: Re-execute all 15 preregistered convex planar CAD wave grids
        shell: pwsh
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/run_r130d_convex_multiplane_cutcell_diagnostic.py `
            --plan benchmarks/acoustics/r130d_convex_multiplane_cutcell_plan_2026-10-09.json `
            --output scratch/ci_convex_multiplane_evidence.json
          @'
          import json
          from pathlib import Path
          import numpy as np
          a=json.loads(Path('scratch/ci_convex_multiplane_evidence.json').read_text())
          b=json.loads(Path('benchmarks/acoustics/r130d_convex_multiplane_cutcell_evidence_2026-10-09.json').read_text())
          assert a['schema_version']==b['schema_version']
          assert a['plan']==b['plan']
          assert a['original_solver_modified'] is False
          assert a['general_cad_qualified'] is False
          assert a['new_geometries_cross_solver_qualified'] is False
          assert a['production_enabled'] is False
          for x,y in zip(a['cases'],b['cases']):
              assert x['name']==y['name']
              assert len(x['levels'])==len(y['levels'])==5
              for p,q in zip(x['levels'],y['levels']):
                  assert p['n']==q['n']
                  assert abs(p['exact_cut_cell_volume_m3']-q['exact_cut_cell_volume_m3'])<1e-8
                  assert p['relative_energy_drift_60_steps']<1e-9
                  assert p['null_max_normalized_by_diagonal']<1e-11
                  aa=np.array([complex(*v) for v in p['actual_driven_transfer_40_80_hz']])
                  bb=np.array([complex(*v) for v in q['actual_driven_transfer_40_80_hz']])
                  assert max(abs(aa-bb))<1e-5
              for p,q in zip(x['adjacent_transfer'],y['adjacent_transfer']):
                  assert abs(p['complex_l2_relative']-q['complex_l2_relative'])<1e-6
          print('PASS: 15 actual bounded convex-room wave solves, immutable plan and no production authority')
          '@ | python -
