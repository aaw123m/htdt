name: verify-open-issues

# Manual issue-verification pipeline. Runs scripts/verify_open_issues.py
# against the open-issue manifest (scripts/issue_verification_manifest.yaml)
# and uploads the JSON + Markdown report as an artifact.
#
# Repo convention is manual dispatch only — this repo has no PR CI, and the
# verdicts are triage signal for humans, not a merge gate. Action SHAs are
# pinned: backend/tests/test_dependency_lock.py fails on floating tags.
#
# A weekly cadence would be harmless (read-only, artifact-only output) but is
# left OFF by default; uncomment to enable.
# on:
#   schedule:
#     - cron: '0 0 * * 1'  # Mondays 00:00 UTC
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read # open-issue listing only; see the commented post-summary step

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CPython 3.12 (x64)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Install backend + test dependencies
        shell: pwsh
        run: python -m pip install -e "backend[dev]"

      - name: Verify open issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
          TMPDIR: C:\t
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\t | Out-Null
          python scripts/verify_open_issues.py --report-dir out\issue-verification

      - name: Upload verification report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-verification-${{ github.run_number }}
          path: out/issue-verification/
          if-no-files-found: error
          retention-days: 90

      # Optional: upsert a status comment on each mapped issue — one marked
      # comment per issue, edited in place on every run (no comment spam;
      # watchers get a single always-current verdict line). Enable
      # deliberately: uncomment this step, change `issues: read` to
      # `issues: write` above, and re-run.
      # - name: Upsert per-issue verdict comments
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   shell: pwsh
      #   run: python scripts/verify_open_issues.py --post-summary-from out\issue-verification\issue_verification_report.json
