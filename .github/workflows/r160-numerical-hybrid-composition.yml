name: R160 Numerical Hybrid Composition

on:
  pull_request:
    paths:
      - 'backend/src/htdt/cad_hybrid_numerical_composition.py'
      - 'backend/src/htdt/cad_hybrid_grid_reconciliation.py'
      - 'backend/src/htdt/cad_hybrid_acoustic_result.py'
      - 'backend/src/htdt/cad_candidate_wave_execution.py'
      - 'backend/src/htdt/cad_wave_excitation.py'
      - 'backend/src/htdt/cad_geometric_acoustics_response.py'
      - 'backend/tests/test_cad_hybrid_numerical_composition.py'
      - 'backend/tests/fixtures/r160_frequency_grid_stitch_fixture.json'
      - 'docs/R160_NUMERICAL_COMPLEX_COMPOSITION_2026-09-20.md'
      - 'docs/R160_FREQUENCY_GRID_RECONCILIATION_2026-09-20.md'
      - '.github/workflows/r160-numerical-hybrid-composition.yml'
  workflow_dispatch:

jobs:
  numerical-composition:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused HTDT test runtime
        run: python -m pip install -e "./backend[dev]"

      - name: Run R160 numerical composition fixtures
        run: python -m pytest -q backend/tests/test_cad_hybrid_numerical_composition.py

      - name: Run existing R160 typed authority regressions
        run: python -m pytest -q backend/tests/test_cad_hybrid_acoustic_result.py

      - name: Enforce scope and non-claim markers
        shell: bash
        run: |
          test ! -e HTDT-Capture/.r160-touch
          grep -q "RDC usage: 0" docs/R160_NUMERICAL_COMPLEX_COMPOSITION_2026-09-20.md
          grep -q "not production solver adoption" docs/R160_NUMERICAL_COMPLEX_COMPOSITION_2026-09-20.md
          grep -q "RDC usage: 0" docs/R160_FREQUENCY_GRID_RECONCILIATION_2026-09-20.md
          grep -q "not production broadband validation" docs/R160_FREQUENCY_GRID_RECONCILIATION_2026-09-20.md
