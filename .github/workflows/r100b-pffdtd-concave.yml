name: R100B PFFDTD Concave Evidence

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_bakeoff.py'
      - 'backend/src/htdt/acoustic_pffdtd_adapter.py'
      - 'backend/tests/test_acoustic_pffdtd_adapter.py'
      - 'benchmarks/acoustics/r100a_manifest.json'
      - 'benchmarks/acoustics/r100b_candidates.json'
      - 'scripts/run_r100b_pffdtd_concave.py'
      - '.github/workflows/r100b-pffdtd-concave.yml'
  workflow_dispatch:

concurrency:
  group: r100b-pffdtd-concave-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-pffdtd-concave:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PFFDTD_SHA: aa319f6c86517cb95aabfae8656277da62c3ead5
      PROBE_OUTPUT: artifacts/r100b/pffdtd_concave.json
      HTDT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install HTDT and pinned PFFDTD probe runtime
        run: |
          python -m pip install -e ".\backend[dev]"
          python -m pip install "numpy==1.26.4" "numba==0.60.0" "scipy==1.14.1" "h5py==3.12.1" "tqdm==4.67.1" "psutil==6.1.1" "memory_profiler==0.61.0"

      - name: Preflight exact-concave probe
        run: |
          python -m py_compile scripts\run_r100b_pffdtd_concave.py
          python -m pytest backend\tests\test_acoustic_pffdtd_adapter.py -q

      - name: Checkout pinned PFFDTD source
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pffdtd-r100b-concave'
          git clone --filter=blob:none https://github.com/bsxfun/pffdtd.git $root
          git -C $root checkout --detach $env:PFFDTD_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:PFFDTD_SHA) {
            throw "PFFDTD checkout mismatch: $actual"
          }
          "PFFDTD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run exact-concave candidate probe
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'pffdtd-r100b-concave-work'
          python scripts\run_r100b_pffdtd_concave.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --upstream-root $env:PFFDTD_ROOT `
            --work-dir $work `
            --output $env:PROBE_OUTPUT

      - name: Show exact-concave evidence outcome
        shell: pwsh
        run: |
          $probe = Get-Content -Raw $env:PROBE_OUTPUT | ConvertFrom-Json
          Write-Host "R100B_PFFDTD_CONCAVE_OUTCOME=$($probe.probe_outcome)"
          Write-Host "R100B_WORKFLOW_IS_FIXTURE_RESULT=$($probe.workflow_result_is_fixture_result)"
          Write-Host "R100B_R100A_HASH=$($probe.r100a_semantic_hash)"
          Write-Host "R100B_CANDIDATE_HASH=$($probe.candidate_manifest_hash)"
          if ($null -ne $probe.details.self_convergence) {
            Write-Host "R100B_PFFDTD_CONCAVE_CONVERGENCE=$($probe.details.self_convergence | ConvertTo-Json -Compress)"
          }
          if ($null -ne $probe.details.reference_status) {
            Write-Host "R100B_PFFDTD_CONCAVE_REFERENCE=$($probe.details.reference_status | ConvertTo-Json -Compress)"
          }
          if ($null -ne $probe.details.resources) {
            Write-Host "R100B_PFFDTD_CONCAVE_RESOURCES=$($probe.details.resources | ConvertTo-Json -Compress)"
          }
          if ($null -ne $probe.error) {
            Write-Host "R100B_PFFDTD_CONCAVE_ERROR=$($probe.error)"
          }

      - name: Upload exact-concave evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r100b-pffdtd-concave
          path: artifacts/r100b/pffdtd_concave*
          if-no-files-found: error
