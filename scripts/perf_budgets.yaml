    rationale: scale ~10x vs small (1500 entities, 24 revisions)
  - operation_id: project_save
    fixture_size: large
    p95_budget_s: 4.0
    rationale: scale ~10x vs small
  - operation_id: project_reopen
    fixture_size: large
    p95_budget_s: 4.0
    rationale: scale ~10x vs small
  - operation_id: scene_revision_apply
    fixture_size: large
