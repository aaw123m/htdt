name: R100B MFEM Wave References

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_bakeoff.py'
      - 'backend/src/htdt/acoustic_bakeoff_observation.py'
      - 'benchmarks/acoustics/r100a_manifest.json'
      - 'benchmarks/acoustics/r100b_candidates.json'
      - 'benchmarks/acoustics/mfem_probe/**'
      - 'scripts/run_r100b_mfem_concave_probe.py'
      - 'scripts/run_r100b_mfem_portal_probe.py'
      - 'scripts/run_r100b_mfem_radiation_probe.py'
      - '.github/workflows/r100b-mfem-concave.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-mfem-concave-reference:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      MFEM_SHA: d964264cdb9a13e94a201b6c236c7721e0c8765f
      PROBE_OUTPUT: artifacts/r100b/mfem_concave_reference.json
      PORTAL_OUTPUT: artifacts/r100b/mfem_portal_continuity.json
      RADIATION_OUTPUT: artifacts/r100b/mfem_radiation_termination.json
      HTDT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused HTDT probe runtime
        run: python -m pip install -e ".\backend" psutil

      - name: Preflight MFEM reference probe scripts
        run: python -m py_compile scripts\\run_r100b_mfem_concave_probe.py scripts\\run_r100b_mfem_portal_probe.py scripts\\run_r100b_mfem_radiation_probe.py

      - name: Checkout pinned MFEM source
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mfem-r100b-concave'
          git clone --filter=blob:none https://github.com/mfem/mfem.git $root
          git -C $root checkout --detach $env:MFEM_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:MFEM_SHA) {
            throw "MFEM checkout mismatch: $actual"
          }
          "MFEM_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and build focused MFEM concave probe
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'mfem-r100b-concave-build'
          $timer = [System.Diagnostics.Stopwatch]::StartNew()

          cmake -S benchmarks\acoustics\mfem_probe -B $build -A x64 -DHTDT_MFEM_SOURCE_DIR="$env:MFEM_ROOT" -DMFEM_USE_EXCEPTIONS=ON
          if ($LASTEXITCODE -ne 0) {
            $timer.Stop()
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_PORTAL_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_RADIATION_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM v4.10 serial CMake configure failed on GitHub-hosted Windows." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_PORTAL_BLOCK_REASON=MFEM v4.10 serial CMake configure failed on GitHub-hosted Windows." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_RADIATION_BLOCK_REASON=MFEM v4.10 serial CMake configure failed on GitHub-hosted Windows." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BUILD_S=$($timer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BUILD_DIR=$build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          cmake --build $build --config Release --target r100b_mfem_concave_transfer --parallel 4
          $buildExit = $LASTEXITCODE
          $timer.Stop()
          "MFEM_BUILD_S=$($timer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MFEM_BUILD_DIR=$build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if ($buildExit -ne 0) {
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_PORTAL_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_RADIATION_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM v4.10 serial library/concave probe build failed on GitHub-hosted Windows." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_PORTAL_BLOCK_REASON=MFEM v4.10 serial library build failed before Portal probe build." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_RADIATION_BLOCK_REASON=MFEM v4.10 serial library build failed before radiation probe build." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          $exe = Get-ChildItem -Path $build -Recurse -Filter 'r100b_mfem_concave_transfer.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_PORTAL_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_RADIATION_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM build succeeded but the concave reference executable was not found." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_PORTAL_BLOCK_REASON=Common MFEM build did not produce the expected concave executable." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_RADIATION_BLOCK_REASON=Common MFEM build did not produce the expected concave executable." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          "MFEM_RUNTIME_AVAILABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MFEM_PROBE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $radiationTimer = [System.Diagnostics.Stopwatch]::StartNew()
          cmake --build $build --config Release --target r100b_mfem_radiation_transfer --parallel 4
          $radiationBuildExit = $LASTEXITCODE
          $radiationTimer.Stop()
          "MFEM_RADIATION_BUILD_S=$($radiationTimer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($radiationBuildExit -ne 0) {
            "MFEM_RADIATION_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_RADIATION_BLOCK_REASON=MFEM v4.10 radiation probe build failed on GitHub-hosted Windows." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            $radiationExe = Get-ChildItem -Path $build -Recurse -Filter 'r100b_mfem_radiation_transfer.exe' | Select-Object -First 1
            if ($null -eq $radiationExe) {
              "MFEM_RADIATION_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              "MFEM_RADIATION_BLOCK_REASON=MFEM radiation build succeeded but the executable was not found." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            } else {
              "MFEM_RADIATION_AVAILABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
              "MFEM_RADIATION_EXE=$($radiationExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            }
          }

          $portalTimer = [System.Diagnostics.Stopwatch]::StartNew()
          cmake --build $build --config Release --target r100b_mfem_portal_transfer --parallel 4
          $portalBuildExit = $LASTEXITCODE
          $portalTimer.Stop()
          "MFEM_PORTAL_BUILD_S=$($portalTimer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($portalBuildExit -ne 0) {
            "MFEM_PORTAL_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_PORTAL_BLOCK_REASON=MFEM v4.10 Portal probe build failed on GitHub-hosted Windows." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          $portalExe = Get-ChildItem -Path $build -Recurse -Filter 'r100b_mfem_portal_transfer.exe' | Select-Object -First 1
          if ($null -eq $portalExe) {
            "MFEM_PORTAL_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_PORTAL_BLOCK_REASON=MFEM Portal build succeeded but the executable was not found." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          "MFEM_PORTAL_AVAILABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MFEM_PORTAL_EXE=$($portalExe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run independent MFEM concave numerical reference
        if: env.MFEM_RUNTIME_AVAILABLE == '1'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mfem-r100b-concave-work'
          python scripts\run_r100b_mfem_concave_probe.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --mfem-root $env:MFEM_ROOT `
            --build-dir $env:MFEM_BUILD_DIR `
            --executable $env:MFEM_PROBE_EXE `
            --work-dir $work `
            --output $env:PROBE_OUTPUT `
            --build-s $env:MFEM_BUILD_S

      - name: Record blocked MFEM build/reference probe
        if: env.MFEM_RUNTIME_AVAILABLE != '1'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mfem-r100b-concave-work'
          python scripts\run_r100b_mfem_concave_probe.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --mfem-root $env:MFEM_ROOT `
            --build-dir $env:MFEM_BUILD_DIR `
            --work-dir $work `
            --output $env:PROBE_OUTPUT `
            --build-s $env:MFEM_BUILD_S `
            --blocked-reason "$env:MFEM_BLOCK_REASON"

      - name: Run MFEM Portal continuity cross-fixture gate
        if: env.MFEM_PORTAL_AVAILABLE == '1'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mfem-r100b-portal-work'
          python scripts\run_r100b_mfem_portal_probe.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --mfem-root $env:MFEM_ROOT `
            --build-dir $env:MFEM_BUILD_DIR `
            --executable $env:MFEM_PORTAL_EXE `
            --work-dir $work `
            --output $env:PORTAL_OUTPUT `
            --build-s $env:MFEM_PORTAL_BUILD_S

      - name: Record blocked MFEM Portal gate
        if: env.MFEM_PORTAL_AVAILABLE != '1'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mfem-r100b-portal-work'
          python scripts\run_r100b_mfem_portal_probe.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --mfem-root $env:MFEM_ROOT `
            --build-dir $env:MFEM_BUILD_DIR `
            --work-dir $work `
            --output $env:PORTAL_OUTPUT `
            --blocked-reason "$env:MFEM_PORTAL_BLOCK_REASON"

      - name: Run MFEM R100A-3 radiation termination gate
        if: env.MFEM_RADIATION_AVAILABLE == '1'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mfem-r100b-radiation-work'
          python scripts\run_r100b_mfem_radiation_probe.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --mfem-root $env:MFEM_ROOT `
            --build-dir $env:MFEM_BUILD_DIR `
            --executable $env:MFEM_RADIATION_EXE `
            --work-dir $work `
            --output $env:RADIATION_OUTPUT `
            --build-s $env:MFEM_RADIATION_BUILD_S

      - name: Record blocked MFEM radiation gate
        if: env.MFEM_RADIATION_AVAILABLE != '1'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'mfem-r100b-radiation-work'
          python scripts\run_r100b_mfem_radiation_probe.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --mfem-root $env:MFEM_ROOT `
            --build-dir $env:MFEM_BUILD_DIR `
            --work-dir $work `
            --output $env:RADIATION_OUTPUT `
            --blocked-reason "$env:MFEM_RADIATION_BLOCK_REASON"

      - name: Show MFEM radiation outcome
        shell: pwsh
        run: |
          $probe = Get-Content -Raw $env:RADIATION_OUTPUT | ConvertFrom-Json
          Write-Host "R100B_MFEM_RADIATION_OUTCOME=$($probe.radiation_fixture_outcome)"
          Write-Host "R100B_MFEM_RADIATION_WORKFLOW_IS_FIXTURE_RESULT=$($probe.workflow_result_is_fixture_result)"
          Write-Host "R100B_MFEM_RADIATION_R100A_HASH=$($probe.r100a_semantic_hash)"
          Write-Host "R100B_MFEM_RADIATION_CANDIDATE_HASH=$($probe.candidate_manifest_hash)"
          if ($null -ne $probe.details.qualification) {
            Write-Host "R100B_MFEM_RADIATION_QUALIFICATION=$($probe.details.qualification | ConvertTo-Json -Compress)"
          }
          if ($null -ne $probe.details.central_observable_evidence) {
            Write-Host "R100B_MFEM_RADIATION_OBSERVABLES=$($probe.details.central_observable_evidence | ConvertTo-Json -Compress)"
          }
          if ($null -ne $probe.details.resource_evidence) {
            Write-Host "R100B_MFEM_RADIATION_RESOURCES=$($probe.details.resource_evidence | ConvertTo-Json -Compress)"
          }

      - name: Show MFEM Portal outcome
        shell: pwsh
        run: |
          $probe = Get-Content -Raw $env:PORTAL_OUTPUT | ConvertFrom-Json
          Write-Host "R100B_MFEM_PORTAL_OUTCOME=$($probe.portal_fixture_outcome)"
          Write-Host "R100B_MFEM_PORTAL_WORKFLOW_IS_FIXTURE_RESULT=$($probe.workflow_result_is_fixture_result)"
          Write-Host "R100B_MFEM_PORTAL_R100A_HASH=$($probe.r100a_semantic_hash)"
          Write-Host "R100B_MFEM_PORTAL_CANDIDATE_HASH=$($probe.candidate_manifest_hash)"
          if ($null -ne $probe.details.cross_fixture_metrics) {
            Write-Host "R100B_MFEM_PORTAL_METRICS=$($probe.details.cross_fixture_metrics | ConvertTo-Json -Compress)"
          }
          if ($null -ne $probe.details.topology_evidence) {
            Write-Host "R100B_MFEM_PORTAL_TOPOLOGY=$($probe.details.topology_evidence | ConvertTo-Json -Compress)"
          }

      - name: Show independent-reference outcome
        shell: pwsh
        run: |
          $probe = Get-Content -Raw $env:PROBE_OUTPUT | ConvertFrom-Json
          Write-Host "R100B_MFEM_CONCAVE_REFERENCE_OUTCOME=$($probe.concave_reference_outcome)"
          Write-Host "R100B_MFEM_IMPEDANCE_REFERENCE_OUTCOME=$($probe.impedance_reference_outcome)"
          Write-Host "R100B_WORKFLOW_RESULT_IS_REFERENCE_RESULT=$($probe.workflow_result_is_reference_result)"
          Write-Host "R100B_R100A_HASH=$($probe.r100a_semantic_hash)"
          Write-Host "R100B_CANDIDATE_HASH=$($probe.candidate_manifest_hash)"

          if ($null -ne $probe.details.convergence) {
            foreach ($level in $probe.details.convergence) {
              Write-Host (
                "R100B_CONVERGENCE=p$($level.coarse_order)->p$($level.fine_order) " +
                "mag_abs_db=$($level.magnitude_max_abs_db) " +
                "mag_rel=$($level.magnitude_max_relative) " +
                "phase_deg=$($level.phase_max_error_deg) " +
                "complex_rms_rel=$($level.complex_rms_relative)"
              )
            }
          }

          if ($null -ne $probe.details.qualification) {
            Write-Host "R100B_REFERENCE_QUALIFICATION=$($probe.details.qualification | ConvertTo-Json -Compress)"
          }
          if ($null -ne $probe.details.resource_evidence) {
            Write-Host "R100B_RESOURCE_EVIDENCE=$($probe.details.resource_evidence | ConvertTo-Json -Compress)"
          }
          if ($null -ne $probe.details.error) {
            Write-Host "R100B_MFEM_REFERENCE_ERROR=$($probe.details.error)"
          }

      - name: Upload R100B MFEM wave-reference evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r100b-mfem-wave-references
          path: |
            artifacts/r100b/mfem_concave_reference.json
            artifacts/r100b/mfem_portal_continuity.json
            artifacts/r100b/mfem_radiation_termination.json
          if-no-files-found: error
