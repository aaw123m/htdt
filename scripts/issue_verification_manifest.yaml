  - issue: 729
    title: "REV59-DEPS: authority dependency / staleness graph"
    notes: >
      DependencyEdgeDeclaration (depedge-) seals typed dependency edges
      (used_as_input / derived_from / calibrated_from /
      validated_against / measured_under_state /
      applicable_under_profile / assumes / requires_capability /
      approved_for_use_by / supersedes / references_only — the last is
