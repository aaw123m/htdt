name: R100B MFEM Concave Bounded Experiment

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_bakeoff_mfem_concave_experiment.py'
      - 'backend/tests/test_acoustic_bakeoff_mfem_concave_experiment.py'
      - 'benchmarks/acoustics/r100b_mfem_concave_experiment_plan.json'
      - 'scripts/run_r100b_mfem_concave_bounded_experiment.py'
      - '.github/workflows/r100b-mfem-concave-bounded-experiment.yml'
  workflow_dispatch:

concurrency:
  group: r100b-mfem-concave-bounded-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-mfem-concave-bounded:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: backend/src
      MFEM_SHA: d964264cdb9a13e94a201b6c236c7721e0c8765f
      EXPERIMENT_DIR: artifacts/r100b/mfem_concave_bounded
      EXPERIMENT_REPORT: artifacts/r100b/mfem_concave_bounded/report.json
      HTDT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused HTDT experiment runtime
        run: python -m pip install -e ".\backend[dev]" psutil

      - name: Validate bounded experiment contract
        run: python -m pytest backend\tests\test_acoustic_bakeoff_mfem_concave_experiment.py

      - name: Preflight bounded experiment runner
        run: python -m py_compile scripts\run_r100b_mfem_concave_bounded_experiment.py

      - name: Checkout exact MFEM candidate
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'mfem-r100b-concave-bounded'
          git clone --filter=blob:none https://github.com/mfem/mfem.git $root
          git -C $root checkout --detach $env:MFEM_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:MFEM_SHA) {
            throw "MFEM checkout mismatch: $actual"
          }
          "MFEM_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure and build existing finite-record probe
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'mfem-r100b-concave-bounded-build'
          "MFEM_BUILD_DIR=$build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $timer = [System.Diagnostics.Stopwatch]::StartNew()
          cmake -S benchmarks\acoustics\mfem_probe -B $build -A x64 -DHTDT_MFEM_SOURCE_DIR="$env:MFEM_ROOT" -DMFEM_USE_EXCEPTIONS=ON
          if ($LASTEXITCODE -ne 0) {
            $timer.Stop()
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM v4.10 serial configure failed for bounded experiment." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BUILD_S=$($timer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          cmake --build $build --config Release --target r100b_mfem_concave_finite_record --parallel 4
          $buildExit = $LASTEXITCODE
          $timer.Stop()
          "MFEM_BUILD_S=$($timer.Elapsed.TotalSeconds.ToString('R',[Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if ($buildExit -ne 0) {
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM v4.10 finite-record target build failed." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          $exe = Get-ChildItem -Path $build -Recurse -Filter 'r100b_mfem_concave_finite_record.exe' | Select-Object -First 1
          if ($null -eq $exe) {
            "MFEM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "MFEM_BLOCK_REASON=MFEM finite-record executable missing after successful build." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }
          "MFEM_RUNTIME_AVAILABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MFEM_PROBE_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run five-attempt bounded experiment
        if: env.MFEM_RUNTIME_AVAILABLE == '1'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:EXPERIMENT_DIR | Out-Null
          $work = Join-Path $env:EXPERIMENT_DIR 'raw'
          python scripts\run_r100b_mfem_concave_bounded_experiment.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --plan benchmarks\acoustics\r100b_mfem_concave_experiment_plan.json `
            --mfem-root $env:MFEM_ROOT `
            --build-dir $env:MFEM_BUILD_DIR `
            --executable $env:MFEM_PROBE_EXE `
            --work-dir $work `
            --output $env:EXPERIMENT_REPORT `
            --native-build-s $env:MFEM_BUILD_S

      - name: Record setup/build BLOCKED experiment
        if: env.MFEM_RUNTIME_AVAILABLE != '1'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:EXPERIMENT_DIR | Out-Null
          $work = Join-Path $env:EXPERIMENT_DIR 'raw'
          python scripts\run_r100b_mfem_concave_bounded_experiment.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --plan benchmarks\acoustics\r100b_mfem_concave_experiment_plan.json `
            --mfem-root $env:MFEM_ROOT `
            --build-dir $env:MFEM_BUILD_DIR `
            --work-dir $work `
            --output $env:EXPERIMENT_REPORT `
            --native-build-s $env:MFEM_BUILD_S `
            --blocked-reason "$env:MFEM_BLOCK_REASON"

      - name: Show bounded experiment outcome
        shell: pwsh
        run: |
          $report = Get-Content -Raw $env:EXPERIMENT_REPORT | ConvertFrom-Json
          Write-Host "R100B_MFEM_CONCAVE_BOUNDED_OUTCOME=$($report.decision.outcome)"
          Write-Host "R100B_REPORT_IDENTITY=$($report.decision.deterministic_report_identity_sha256)"
          Write-Host "R100B_FIXTURE_HASH=$($report.authority_binding.fixture_semantic_hash)"
          foreach ($attempt in $report.decision.attempt_results) {
            Write-Host (
              "R100B_ATTEMPT=$($attempt.attempt_id) status=$($attempt.status) " +
              "reason=$($attempt.reason_code) elements=$($attempt.elements) " +
              "ndofs=$($attempt.ndofs) solve_s=$($attempt.solve_s)"
            )
          }
          foreach ($track in $report.decision.track_evaluations) {
            Write-Host "R100B_TRACK=$($track.track_id) status=$($track.status) violations=$($track.violations -join ',')"
          }

      - name: Upload immutable-run input/output bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r100b-mfem-concave-bounded-experiment
          path: artifacts/r100b/mfem_concave_bounded
          if-no-files-found: error
          retention-days: 90
