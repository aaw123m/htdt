name: Auto-merge

# Merges pull requests once all their checks pass. A PR is eligible when it
# carries the `automerge` label or is authored by the Devin integration bot.
# The workflow re-evaluates eligibility on every PR event, every completed
# check suite / commit status, and every push to main — each merge pushes to
# main, which fires the sweep again so queued green PRs merge back-to-back
# instead of waiting a full CI cycle between hops. `workflow_dispatch`
# allows a manual sweep of all open PRs.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
  push:
    branches: [main]
  # check_suite.completed does not fire for suites produced by GitHub Actions
  # itself; workflow_run.completed on the CI workflows is the reliable signal.
  workflow_run:
    workflows: ["CI", "Windows Release Artifact"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft != true
    steps:
      - name: Merge eligible PRs with green checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -u
          BOT_LOGIN="devin-ai-integration[bot]"

          eligible() {
            local pr_number="$1"
            gh pr view "$pr_number" --repo "$REPO" \
              --json labels,author,isDraft,state,headRefOid \
              --jq '(.isDraft == false) and (.state == "OPEN") and
                    ([.labels[].name] | any(. == "automerge"))'
          }

          merge_if_green() {
            local pr_number="$1"
            local ok
            ok=$(eligible "$pr_number") || return 0
            if [ "$ok" != "true" ]; then
              echo "PR #$pr_number: not eligible, skipping"
              return 0
            fi

            local blockers
            # The `merge` check is this workflow's own job reporting on the
            # triggering commit — still pending while we run. Excluding it
            # lets a PR merge itself once its real checks are green.
            blockers=$(gh pr checks "$pr_number" --repo "$REPO" \
              --json name,bucket \
              --jq '[.[] | select(.bucket != "pass" and .bucket != "skipping" and .name != "merge")] | map(.name + "=" + .bucket) | join(", ")') || {
                echo "PR #$pr_number: could not read checks, skipping"
                return 0
              }
            if [ -n "$blockers" ]; then
              echo "PR #$pr_number: waiting on checks: $blockers"
              return 0
            fi

            echo "PR #$pr_number: all checks green, squash merging"
            gh pr merge "$pr_number" --repo "$REPO" --squash --delete-branch \
              || echo "PR #$pr_number: merge failed (see log above)"
          }

          sweep() {
            # One API call covers the whole sweep: eligibility and every
            # check rollup are folded into the PR list response instead of
            # two calls per open PR. The automerge label is the queue: an
            # orchestrator labels only the head PR so merges land one at a
            # time in a chosen order.
            local prs
            prs=$(gh pr list --repo "$REPO" --state open --limit 100 \
              --json number,author,labels,isDraft,state,statusCheckRollup) || {
              echo "could not list PRs, skipping sweep"
              return 0
            }

            local verdicts
            verdicts=$(printf '%s' "$prs" | jq -r --arg bot "$BOT_LOGIN" '
              def ctxname: (.name // .context // "");
              def passing:
                ( ((.status // "") == "COMPLETED") and
                  ((.conclusion // "") | . == "SUCCESS" or . == "SKIPPED" or . == "NEUTRAL") )
                or ((.state // "") == "SUCCESS");
              .[]
              | select(.isDraft == false and .state == "OPEN")
              | select([.labels[].name] | index("automerge"))
              | ([.statusCheckRollup[]? | select(ctxname != "merge") | select(passing | not) | ctxname]) as $blockers
              | if ($blockers | length) == 0
                then "MERGE \(.number)"
                else "WAIT \(.number) \($blockers | join(","))"
                end
            ') || { echo "could not evaluate check rollups, skipping sweep"; return 0; }

            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                MERGE\ *)
                  local pr_number="${line#MERGE }"
                  echo "PR #$pr_number: all checks green, squash merging"
                  gh pr merge "$pr_number" --repo "$REPO" --squash --delete-branch \
                    || echo "PR #$pr_number: merge failed (see log above)"
                  ;;
                WAIT\ *)
                  echo "PR ${line#WAIT }: waiting on checks"
                  ;;
              esac
            done <<< "$verdicts"
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            merge_if_green "${{ github.event.pull_request.number }}"
          else
            sweep
          fi
