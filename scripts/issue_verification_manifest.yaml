- issue: 737
  title: Same-channel surround-array qualification authority
  notes: 'SameChannelSpeakerArray (scar-) requires ≥2 members and rejects per-member
    independent adjustment under a physical shared-output topology; assert_member_adjustment
    enforces the wiring gate. evaluate_array_qualification requires ≥2 measured seats
    plus a holdout plus summed-field evidence for any coverage verdict — single-seat
    evidence stays unqualified, coherent-cancellation seats surface as seat_anomaly,
    and arrayed object-mode reproduction records localization_tradeoff.

    '
