version: 1
migration:
  original_repo: bolph71656-ai/Home-Theater-Digital-Twin
  original_capture_repo: bolph71656-ai/HTDT-Capture
  current_repo: ka0923s-a11y/HTDT
  current_capture_repo: ka0923s-a11y/HTDT-Capture
  note: 'HTDT was migrated from bolph71656-ai/Home-Theater-Digital-Twin to ka0923s-a11y/HTDT on 2026-10-05. Both repositories'' pull-request merge histories exist in this repo''s git history and their numbers overlap; every reference in canonical docs is therefore written as owner/repo#number. Bare #N is invalid. Issue numbers were NOT preserved across the migration: only the issues listed with status=imported exist on the current repo, and they were renumbered. Original repos are offline, so unverifiable historical objects are marked unavailable rather than guessed.'
reference_syntax:
  issue_or_pr: <owner>/<repo>#<number>
  chain_suffix: A '/'-separated suffix inherits the leading repo (e.g. owner/repo#228/#236).
  merge_sha: Implementation/merge claims append ' (merge <8-char sha>)' giving the merge commit on main.
  unavailable: Unrecoverable objects append ' (unavailable)'.
  superseded: Refs superseded by a different PR append ' (superseded)'.
  run: Diagnostic workflow runs use 'run-<number>' (project artifacts, not repo objects).
