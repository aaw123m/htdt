name: O100G workflow UX

on:
  push:
    branches:
      - feat/o100g-workflow-ux
  pull_request:
    paths:
      - 'backend/src/htdt/system_expansion_workflow.py'
      - 'backend/src/htdt/system_expansion_widgets.py'
      - 'backend/src/htdt/cad_topology_search.py'
      - 'backend/src/htdt/room_viewport.py'
      - 'backend/src/htdt/room_workspace.py'
      - 'backend/src/htdt/optimization_workflow_workspace.py'
      - 'backend/src/htdt/workflow_navigation.py'
      - 'backend/tests/test_system_expansion_workflow.py'
      - 'backend/tests/test_room_workspace.py'
      - 'backend/tests/test_optimization_workflow_workspace.py'
      - '.github/workflows/o100g-workflow-ux.yml'

permissions:
  contents: read

jobs:
  software-semantics:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install offscreen Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Compile changed Python
        run: |
          python -m py_compile \
            backend/src/htdt/system_expansion_workflow.py \
            backend/src/htdt/system_expansion_widgets.py \
            backend/src/htdt/cad_topology_search.py \
            backend/src/htdt/room_viewport.py \
            backend/src/htdt/room_workspace.py \
            backend/src/htdt/optimization_workflow_workspace.py \
            backend/src/htdt/workflow_navigation.py
      - name: Focused O100G workflow semantics
        run: python -m pytest backend/tests/test_system_expansion_workflow.py
      - name: O100B equipment-lineage regression
        run: python -m pytest backend/tests/test_cad_topology_search.py
      - name: Room Optimize navigation regressions
        run: |
          python -m pytest \
            backend/tests/test_room_workspace.py \
            backend/tests/test_optimization_workflow_workspace.py
