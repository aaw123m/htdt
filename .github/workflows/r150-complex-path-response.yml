name: R150 Complex Path Response Authority

on:
  pull_request:
    paths:
      - 'backend/src/htdt/cad_geometric_acoustics_response.py'
      - 'backend/tests/test_cad_geometric_acoustics_response.py'
      - 'backend/src/htdt/cad_geometric_acoustics_adapter.py'
      - 'backend/src/htdt/cad_directivity.py'
      - 'backend/src/htdt/cad_equipment.py'
      - 'backend/src/htdt/acoustic_benchmark.py'
      - 'backend/src/htdt/r120_geometry_compiler.py'
      - 'backend/tests/test_cad_geometric_acoustics_adapter.py'
      - 'docs/R150_COMPLEX_PATH_RESPONSE_AUTHORITY.md'
      - '.github/workflows/r150-complex-path-response.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  response-authority:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend/src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused HTDT test runtime
        run: python -m pip install pydantic==2.13.4 shapely==2.1.2 pytest==9.1.1

      - name: Run R150 physical response authority fixtures
        run: python -m pytest backend/tests/test_cad_geometric_acoustics_response.py

      - name: Run existing R150 geometry regressions
        run: python -m pytest backend/tests/test_cad_geometric_acoustics_adapter.py
