name: R130C Candidate Causal Boundary Execution

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_pffdtd_causal_boundary.py'
      - 'backend/src/htdt/cad_candidate_wave_execution.py'
      - 'backend/src/htdt/cad_pffdtd_resource_estimator.py'
      - 'backend/tests/test_acoustic_pffdtd_causal_boundary.py'
      - 'backend/tests/test_acoustic_pffdtd_impedance_adapter.py'
      - 'backend/tests/test_cad_candidate_wave_execution.py'
      - 'backend/tests/test_cad_pffdtd_resource_estimator.py'
      - 'scripts/run_r130a_candidate_wave_execution.py'
      - 'scripts/run_r130b_candidate_impedance_execution.py'
      - 'scripts/run_r130c_candidate_causal_boundary_execution.py'
      - 'docs/R130C_CAUSAL_FREQUENCY_DEPENDENT_BOUNDARY_2026-09-20.md'
      - 'docs/IMPLEMENTATION_STATUS.md'
      - '.github/workflows/r130c-candidate-causal-boundary-execution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-pffdtd-causal-boundary:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PFFDTD_SHA: aa319f6c86517cb95aabfae8656277da62c3ead5
      EVIDENCE_OUTPUT: artifacts/r130c/candidate_causal_boundary_execution.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install HTDT and pinned PFFDTD candidate runtime
        run: |
          python -m pip install -e ".\backend[dev]"
          python -m pip install "numpy==1.26.4" "numba==0.60.0" "scipy==1.14.1" "h5py==3.12.1" "tqdm==4.67.1" "psutil==6.1.1" "memory_profiler==0.61.0"

      - name: Run focused R130B/R130C and resource-estimator tests
        run: >
          python -m pytest
          backend\tests\test_acoustic_pffdtd_causal_boundary.py
          backend\tests\test_acoustic_pffdtd_impedance_adapter.py
          backend\tests\test_cad_candidate_wave_execution.py
          backend\tests\test_cad_pffdtd_resource_estimator.py

      - name: Checkout exact PFFDTD candidate implementation
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'pffdtd-r130c-candidate'
          git clone --filter=blob:none https://github.com/bsxfun/pffdtd.git $root
          git -C $root checkout --detach $env:PFFDTD_SHA
          $actual = (git -C $root rev-parse HEAD).Trim().ToLowerInvariant()
          if ($actual -ne $env:PFFDTD_SHA) {
            throw "PFFDTD checkout mismatch: $actual"
          }
          "PFFDTD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Execute bounded causal frequency-dependent boundary fixture
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP 'r130c-candidate-causal-boundary'
          python scripts\run_r130c_candidate_causal_boundary_execution.py `
            --upstream-root $env:PFFDTD_ROOT `
            --work-root $work `
            --output $env:EVIDENCE_OUTPUT

      - name: Enforce R130C candidate-only evidence semantics
        shell: pwsh
        run: |
          $evidence = Get-Content -Raw $env:EVIDENCE_OUTPUT | ConvertFrom-Json
          if ($evidence.status -ne 'PASS') { throw "R130C execution status=$($evidence.status)" }
          if ($evidence.dispatch_state -ne 'READY') { throw "dispatch was not READY" }
          if ($evidence.actual_pffdtd_causal_boundary_execution -ne $true) { throw "actual causal execution evidence missing" }
          if ($evidence.normal_incidence_reference.status -ne 'PASS') { throw "normal-incidence reference failed" }
          if ($evidence.normal_incidence_reference.passivity_status -ne 'PASS') { throw "passivity reference failed" }
          if ($evidence.preflight.nonpassive_branch_rejected -ne $true) { throw "non-passive input was not rejected" }
          if ($evidence.preflight.valid_band_extrapolation_rejected -ne $true) { throw "valid-band enforcement missing" }
          if ($evidence.reopen.save_reopen_exact_reresolution -ne $true) { throw "save/reopen evidence missing" }
          if ($evidence.stale_semantics.old_result_not_reusable_for_changed_boundary_identity -ne $true) { throw "stale semantics missing" }
          if ($null -eq $evidence.resource_estimate_ref) { throw "resource estimate provenance missing" }
          if ($evidence.production_solver_selected -ne $false) { throw "production adoption claim is forbidden" }
          if ($evidence.gpu_execution -ne $false) { throw "GPU execution claim is forbidden" }
          if ($evidence.r170_integration -ne $false) { throw "R170 integration claim is forbidden" }
          if ($evidence.owned_room_evidence -ne $false) { throw "owned-room evidence claim is forbidden" }
          if ($evidence.scalar_absorption_conversion -ne $false) { throw "scalar absorption conversion is forbidden" }
          if ($evidence.sampled_response_ifft -ne $false) { throw "sampled-response IFFT is forbidden" }
          if ($evidence.rdc_calls -ne 0) { throw "RDC must remain zero" }
          if ($evidence.pffdtd_material_assets.Count -ne 1) { throw "expected exactly one causal material asset" }
          if ($evidence.pffdtd_material_assets[0].active_boundary_node_count -lt 1) { throw "causal material has no active PFFDTD boundary nodes" }
          Write-Host "R130C_BOUNDARY=$($evidence.boundary_authority_ref.semantic_hash_sha256)"
          Write-Host "R130C_COMPILED_BOUNDARY=$($evidence.compiled_boundary_sha256)"
          Write-Host "R130C_INPUT=$($evidence.candidate_execution_input_sha256)"
          Write-Host "R130C_RESOURCE_ESTIMATE=$($evidence.resource_estimate_ref.semantic_hash_sha256)"
          Write-Host "R130C_RESULT=$($evidence.result_sha256)"
          Write-Host "R130C_RAW_SOLVER_ASSET=$($evidence.raw_solver_asset_sha256)"

      - name: Upload exact R130C evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r130c-candidate-causal-boundary-execution
          path: |
            artifacts/r130c/candidate_causal_boundary_execution.json
          if-no-files-found: error
