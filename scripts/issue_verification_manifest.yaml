    - backend/tests/test_rev59_loudspk.py::test_vent_flow_requires_vented_alignment
    description: '大信号証拠クラス・非線形パラメータ宣言・レベル適用域の fail-closed 検証；Xmax セマンティクス比較・ポート流動能力・
      出力限界評価の verdict 梯子。

      '
- issue: 734
  title: Loudspeaker source-normalization / absolute-output authority
  notes: 'LoudspeakerSourceNormalization (snrm-) pins capability class and normalization
    method — an absolute capability cannot be declared under per-frequency or per-polar
    renormalization. ReferenceDriveCondition (rdrv-) types the drive quantity and
    requires its value; convert_reference_drive blocks voltage↔power conversion without
    pinned impedance evidence (equivalence_blocked). AbsoluteAcousticOutputAnchor
    (aout-) pins drive reference, reference distance and acoustic origin; evaluate_absolute_prediction
    keeps relative-shape datasets at relative_response_only and requires the full
    anchor before absolute_spl_prediction_eligible.

