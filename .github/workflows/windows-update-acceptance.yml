name: Windows Update Acceptance

# Issue #811: prove the real user update path — a pinned OLD build is
# installed per-user, seeds a real data root, then a NEW installer runs
# over the same install root/AppId and must preserve data, replace the
# packaged tree exactly, keep file associations, and uninstall cleanly.
#
# This lane builds two full package+installer identities, so it runs on
# demand or weekly — never inside normal PR budgets. The pinned OLD
# baseline lives in scripts/update_acceptance_old_commit.txt.

on:
  workflow_dispatch:
    inputs:
      old_commit:
        description: "OLD baseline commit (default: pinned file)"
        required: false
        default: ""
      new_commit:
        description: "NEW commit (default: workflow ref)"
        required: false
        default: ""
  schedule:
    - cron: "7 5 * * 2"

permissions:
  contents: read

concurrency:
  group: windows-update-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-acceptance:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout workflow source for pin file
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve OLD/NEW commits
        shell: pwsh
        run: |
          $old = "${{ github.event.inputs.old_commit }}".Trim()
          if (-not $old) {
            $old = (Get-Content scripts\update_acceptance_old_commit.txt |
              Where-Object { $_ -notmatch '^\s*#' -and $_.Trim() } |
              Select-Object -First 1).Trim()
          }
          if ($old -notmatch '^[0-9a-f]{40}$') {
            throw "OLD baseline is not a full commit SHA: '$old'"
          }
          $new = "${{ github.event.inputs.new_commit }}".Trim()
          if (-not $new) { $new = "${{ github.sha }}" }
          "old_commit=$old" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "new_commit=$new" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: pins

      - name: Checkout NEW source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.pins.outputs.new_commit }}
          path: new-src

      - name: Checkout OLD source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.pins.outputs.old_commit }}
          path: old-src

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 --no-progress -y
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
            throw "Chocolatey Inno Setup install failed with exit code $LASTEXITCODE"
          }

      - name: Build OLD package and installer
        shell: pwsh
        run: |
          Push-Location old-src
          try {
            .\scripts\build-native.ps1 -OutputDir "$env:RUNNER_TEMP\htdt-old-package" -PythonExe (Get-Command python).Source
            .\scripts\build-installer.ps1 `
              -PackageDir "$env:RUNNER_TEMP\htdt-old-package\HTDT" `
              -OutputDir "$env:RUNNER_TEMP\htdt-old-installer"
          } finally {
            Pop-Location
          }

      - name: Build NEW package and installer
        shell: pwsh
        run: |
          Push-Location new-src
          try {
            .\scripts\build-native.ps1 -OutputDir "$env:RUNNER_TEMP\htdt-new-package" -PythonExe (Get-Command python).Source
            .\scripts\build-installer.ps1 `
              -PackageDir "$env:RUNNER_TEMP\htdt-new-package\HTDT" `
              -OutputDir "$env:RUNNER_TEMP\htdt-new-installer"
          } finally {
            Pop-Location
          }

      - name: Validate in-place update acceptance
        shell: pwsh
        run: |
          $oldInstaller = Get-ChildItem "$env:RUNNER_TEMP\htdt-old-installer\HTDT-Setup-*.exe" |
            Select-Object -First 1
          $newInstaller = Get-ChildItem "$env:RUNNER_TEMP\htdt-new-installer\HTDT-Setup-*.exe" |
            Select-Object -First 1
          if (-not $oldInstaller -or -not $newInstaller) {
            throw "OLD or NEW installer artifact missing"
          }
          "OLD=$($oldInstaller.Name) NEW=$($newInstaller.Name)" | Write-Output
          python new-src\scripts\validate_update_windows.py `
            --old-installer $oldInstaller.FullName `
            --new-installer $newInstaller.FullName `
            --work-dir "$env:RUNNER_TEMP\htdt-update-acceptance"

      - name: Upload update acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: HTDT-windows-update-acceptance
          path: ${{ runner.temp }}\htdt-update-acceptance\update-acceptance-report.json
          if-no-files-found: error
