      - id: evidence-attestation
        kind: pytest
        tests:
          - backend/tests/test_rev59_deps.py::test_att10_signed_and_timestamped_verifies
          - backend/tests/test_rev59_deps.py::test_att20_hash_only_confirms_integrity_only
          - backend/tests/test_rev59_deps.py::test_att30_unchecked_signature_is_unprovened
          - backend/tests/test_rev59_deps.py::test_att40_declared_time_only
          - backend/tests/test_rev59_deps.py::test_att50_historical_signature_under_trusted_time
          - backend/tests/test_rev59_deps.py::test_att60_manifest_mismatch_fails
          - backend/tests/test_rev59_deps.py::test_att70_trusted_timestamp_only
          - backend/tests/test_rev59_deps.py::test_att75_external_reference_unverifiable
          - backend/tests/test_rev59_deps.py::test_att80_attestation_chain
          - backend/tests/test_rev59_deps.py::test_att85_repository_round_trip_and_tamper
          - backend/tests/test_rev59_deps.py::test_att90_unsupported_digest_policy_fails_closed
        description: >
          Time-authority ladder (trusted > declared > unknown),
          hash-only vs MAC vs signed taxonomy, unchecked-signature
          unprovened, historical verification under trusted time,
