        description: >
          個体測定の取込経路 (計器 sha 結合)、同一型番交換時の
          #596 陳腐化 UI、population tolerance プロファイル権威との
          結合は残件。
  - issue: 632
    title: "REV57-AUD: media-playback capability qualification"
    notes: >
      CadPlaybackStackIdentity pins device/OS/app/engine/firmware/
      license/source mode; CadMediaProfileRequirement seals codec/
      profile/level/HDR/encryption (WAVE profile binding only for
      segmented_adaptive delivery, versioned + optional). Capability
      classes declared_by_* → tested_* require empirical evidence;
      tested_playable requires requested_profile_rendered output.
      Operation runs cover seek/switch/resume/wake — first frame is
      never the whole capability. Verdicts separate
      qualified_exact_profile from fallback/mismatch/transport/
      intermittent/insufficient (+stale on stack update). DRM
