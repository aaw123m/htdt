- issue: 729
  title: 'REV59-DEPS: authority dependency / staleness graph'
  notes: 'DependencyEdgeDeclaration (depedge-) seals typed dependency edges (used_as_input
    / derived_from / calibrated_from / validated_against / measured_under_state /
    applicable_under_profile / assumes / requires_capability / approved_for_use_by
    / supersedes / references_only — the last is non-influencing) with an optional
    DependencyScope footprint (target_fields / observables / retained_observables
    / residual_independence). SemanticChangeEvent (depevt-) pins the changed authority
    + change class + changed fields; DependencyRuleProfile (deprule-) is the versioned
    ruleset mapping (edge kind, change class) -> invalidation effect; the verdict
    pins the exact profile it was evaluated under so a rule change never silently
    reinterprets history. evaluate_staleness computes the transitive closure with
    per-path severity accumulation — descendants inherit the strongest limitation
    on their dependency path (#729 §11) — and emits StalenessAssessment (stale-) with
    current / stale_recompute / stale_remeasure / stale_readback_required / stale_review_required
    / valid_with_limitations / incompatible / superseded / unknown_dependency states;
    no matching rule -> review_required, conservative; subjects with no declared dependency
    coverage -> unknown_dependency. build_revalidation_plan derives the minimal work
    set (revplan-): recompute / regenerate_derived / remeasure_channel / readback_device
    / requalify_profile / review_evidence / full_recommission (never a default).

    '
  checks:
  - id: authority-dependency-graph
    kind: pytest
    tests:
    - backend/tests/test_rev59_deps.py::test_dep10_precise_invalidation_scope
    - backend/tests/test_rev59_deps.py::test_dep20_transitive_closure_path_reported
