# Issue verification manifest — ka0923s-a11y/HTDT
#
# Maps each tracked open GitHub issue to the automated checks that honestly
# evidence progress on it, plus the manual/physical evidence automation can
# never produce. Consumed by scripts/verify_open_issues.py.
#
# Check kinds:
#   pytest  - repo-relative test paths / node ids run via `python -m pytest`
#   script  - a repo-relative argv list; {python}, {work_dir}, {report_dir}
#             placeholders are resolved by the runner
#   manual  - never executed; records the physical/manual evidence required
#
# Verdict rule (per issue, `auto_and_manual`):
#   failing            - any automated check fails, errors, or times out
#   manual_required    - no automated checks are declared
#   verified           - every automated check passed AND no manual entry remains
#   partially_verified - every automated check passed AND manual entries remain
#
# Rules for editing: never add a check that does not exist and run today;
# never weaken a failing check to make a verdict green; when code lands that
# makes an issue fully verifiable, remove its manual entries so it can reach
# `verified`.

version: 1
repo: ka0923s-a11y/HTDT
defaults:
  timeout_seconds: 900
  pytest_workers: 4

issues:
  - issue: 1
    title: "O60R: owned-room campaign execution / hardware evidence gate"
    notes: >
      O60 software authority and the read-only audit gate are merged; what
      remains is the physical owned-room measurement campaign.
    checks:
      - id: o60r-audit-and-campaign-authority
        kind: pytest
        tests:
          - backend/tests/test_o60r_audit.py
          - backend/tests/test_cad_validation_campaign.py
        description: >
          O60R read-only audit gate (scripts/audit_o60_owned_room.py) and the
          validation-campaign authority the campaign must pass through.
      - id: o60r-owned-room-campaign
        kind: manual
        description: >
          実室 owned-room campaign（calibration / holdout / repeatability /
          separation）を人手で実施し、REW API campaign import evidence を取得する。
          scripts/run-o60-owned-room-gate.ps1 が物理ゲートハーネス。
          synthetic fixture や一般 N60 測定ではゲートを開けない。
