- issue: 754
  title: Loudspeaker/subwoofer large-signal mechanical authority
  notes: 'LargeSignalTransducerModel (lstm-) pins evidence class, declared nonlinear-parameter
    kinds (Bl(x)/Kms(x)/Le(x,i)), enclosure alignment and level applicability — a
    model_derived_excursion claim requires declared nonlinear parameters and a large_signal_validated_to_level
    claim requires a measured evidence class plus a pinned validation. ExcursionCapability
    (excp-) pins convention + definition basis + distortion criterion so Xmax numbers
    are equated only on identical semantics; compare_excursion_datums returns incomparable
    on convention/basis/ criterion mismatches. evaluate_output_limit keeps a small-signal-only
    model at small_signal_only — linear extrapolation is never promoted — and protection
    mechanisms gate at protection_limited.

    '
  checks:
  - id: large-signal
    kind: pytest
    tests:
    - backend/tests/test_rev59_loudspk.py::test_large_signal_seal
    - backend/tests/test_rev59_loudspk.py::test_large_signal_validated_level_requires_measured
    - backend/tests/test_rev59_loudspk.py::test_large_signal_unknown_params_rejected
