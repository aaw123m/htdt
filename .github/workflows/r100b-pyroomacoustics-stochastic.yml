name: R100B Pyroomacoustics Stochastic Gate

on:
  pull_request:
    paths:
      - 'backend/src/htdt/acoustic_bakeoff.py'
      - 'backend/src/htdt/acoustic_benchmark.py'
      - 'backend/src/htdt/acoustic_pyroom_stochastic.py'
      - 'backend/tests/test_acoustic_pyroom_stochastic.py'
      - 'benchmarks/acoustics/r100a_manifest.json'
      - 'benchmarks/acoustics/r100b_candidates.json'
      - 'benchmarks/acoustics/r100b_pyroom_stochastic_authority.json'
      - 'scripts/run_r100b_pyroomacoustics_stochastic.py'
      - '.github/workflows/r100b-pyroomacoustics-stochastic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-stochastic-reference:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: backend/src
      PROBE_OUTPUT: artifacts/r100b/pyroomacoustics_stochastic.json
      RAW_OUTPUT: artifacts/r100b/pyroomacoustics_stochastic_raw.npz
      HTDT_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install focused stochastic evaluator runtime
        run: python -m pip install pydantic==2.13.4 shapely==2.1.2 pytest==9.1.1 psutil

      - name: Run focused stochastic evaluator tests
        run: python -m pytest backend\tests\test_acoustic_pyroom_stochastic.py

      - name: Resolve official pyroomacoustics 0.10.1 Windows wheel
        shell: pwsh
        run: |
          $setupTimer = [System.Diagnostics.Stopwatch]::StartNew()
          $wheelDir = Join-Path $env:RUNNER_TEMP 'r100b-pyroom-stochastic-wheel'
          New-Item -ItemType Directory -Force -Path $wheelDir | Out-Null

          python -m pip download --only-binary=:all: --no-deps pyroomacoustics==0.10.1 -d $wheelDir
          if ($LASTEXITCODE -ne 0) {
            $setupTimer.Stop()
            "PYROOM_ENV_SETUP_S=$($setupTimer.Elapsed.TotalSeconds.ToString('F6', [System.Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PYROOM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PYROOM_BLOCK_REASON=No official pyroomacoustics 0.10.1 CPython 3.12 Windows wheel was available from the configured package index." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          $wheel = Get-ChildItem -Path $wheelDir -Filter 'pyroomacoustics-0.10.1-*.whl' | Select-Object -First 1
          if ($null -eq $wheel) {
            $setupTimer.Stop()
            "PYROOM_ENV_SETUP_S=$($setupTimer.Elapsed.TotalSeconds.ToString('F6', [System.Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PYROOM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PYROOM_BLOCK_REASON=Wheel download returned success but no pyroomacoustics 0.10.1 wheel was found." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          $hash = (Get-FileHash -Algorithm SHA256 -Path $wheel.FullName).Hash.ToLowerInvariant()
          "PYROOM_WHEEL_PATH=$($wheel.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PYROOM_WHEEL_FILENAME=$($wheel.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PYROOM_WHEEL_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          python -m pip install $wheel.FullName
          if ($LASTEXITCODE -ne 0) {
            $setupTimer.Stop()
            "PYROOM_ENV_SETUP_S=$($setupTimer.Elapsed.TotalSeconds.ToString('F6', [System.Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PYROOM_RUNTIME_AVAILABLE=0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "PYROOM_BLOCK_REASON=Official pyroomacoustics 0.10.1 Windows wheel was found but could not be installed with its dependencies." | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            exit 0
          }

          $setupTimer.Stop()
          "PYROOM_ENV_SETUP_S=$($setupTimer.Elapsed.TotalSeconds.ToString('F6', [System.Globalization.CultureInfo]::InvariantCulture))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PYROOM_RUNTIME_AVAILABLE=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run stochastic seed and convergence probe
        if: env.PYROOM_RUNTIME_AVAILABLE == '1'
        shell: pwsh
        run: |
          python scripts\run_r100b_pyroomacoustics_stochastic.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --authority benchmarks\acoustics\r100b_pyroom_stochastic_authority.json `
            --output $env:PROBE_OUTPUT `
            --raw-output $env:RAW_OUTPUT `
            --wheel-filename $env:PYROOM_WHEEL_FILENAME `
            --wheel-sha256 $env:PYROOM_WHEEL_SHA256 `
            --environment-setup-s $env:PYROOM_ENV_SETUP_S

      - name: Record blocked stochastic probe
        if: env.PYROOM_RUNTIME_AVAILABLE != '1'
        shell: pwsh
        run: |
          python scripts\run_r100b_pyroomacoustics_stochastic.py `
            --manifest benchmarks\acoustics\r100a_manifest.json `
            --candidates benchmarks\acoustics\r100b_candidates.json `
            --authority benchmarks\acoustics\r100b_pyroom_stochastic_authority.json `
            --output $env:PROBE_OUTPUT `
            --raw-output $env:RAW_OUTPUT `
            --environment-setup-s $env:PYROOM_ENV_SETUP_S `
            --blocked-reason "$env:PYROOM_BLOCK_REASON"

      - name: Show separate workflow and candidate outcomes
        shell: pwsh
        run: |
          $probe = Get-Content -Raw $env:PROBE_OUTPUT | ConvertFrom-Json
          if (@('pass', 'fail', 'blocked') -notcontains $probe.probe_outcome) {
            throw "Unexpected probe outcome: $($probe.probe_outcome)"
          }
          if ([string]::IsNullOrWhiteSpace($probe.r100a_semantic_hash)) {
            throw 'Missing R100A semantic hash'
          }
          if ([string]::IsNullOrWhiteSpace($probe.stochastic_authority_semantic_hash)) {
            throw 'Missing stochastic authority semantic hash'
          }
          Write-Host 'R100B_WORKFLOW_STATUS=PASS'
          Write-Host "R100B_CANDIDATE_STOCHASTIC_OUTCOME=$($probe.probe_outcome)"
          Write-Host "R100B_R100A_HASH=$($probe.r100a_semantic_hash)"
          Write-Host "R100B_STOCHASTIC_AUTHORITY_HASH=$($probe.stochastic_authority_semantic_hash)"
          if ($null -ne $probe.evaluation) {
            Write-Host "R100B_SAME_SEED_REPLAY=$($probe.evaluation.repeatability_status)"
            Write-Host "R100B_STATISTICAL_CONVERGENCE=$($probe.evaluation.convergence_status)"
          }

      - name: Upload R100B pyroomacoustics stochastic evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r100b-pyroomacoustics-stochastic
          path: artifacts/r100b/
          if-no-files-found: error
