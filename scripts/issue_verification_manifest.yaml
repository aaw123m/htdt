    evaluate_log_operation (logop-) derives fail-closed verdicts: cross-identity differences/compares
    -> incompatible_quantities; gain application without a declared linear chain ->
    unverified, on a nonlinear/dynamic chain -> nonlinear_chain; coherent sums without
